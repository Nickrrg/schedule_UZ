<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конструктор расписания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F6FB; --panel:#EAF2FD; --surface:#FFFFFF; --surface-2:#F4F8FE;
  --ink:#10233F; --ink-soft:#6A7C95; --border:#DFE7F2;
  --accent:#2F7EEA; --accent-ink:#FFFFFF; --accent-soft:#E4EFFD; --accent-2:#2F7EEA; --accent-2-ink:#FFFFFF;
  --ok:#2E9E5B; --ok-bg:#E3F5EA; --danger:#E5484D; --danger-bg:#FDECEC;
  --shadow:rgba(16,35,63,0.06); --radius:14px;
  --font-body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1726; --panel:#132033; --surface:#18263B; --surface-2:#1D2E47;
    --ink:#E7EEF8; --ink-soft:#93A4BC; --border:#2A3C57;
    --accent:#4C95F5; --accent-soft:#1E3556; --accent-2:#4C95F5;
    --ok:#4CC27E; --ok-bg:#16362A; --danger:#FF6B6F; --danger-bg:#3A1F24; --shadow:rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1726; --panel:#132033; --surface:#18263B; --surface-2:#1D2E47;
  --ink:#E7EEF8; --ink-soft:#93A4BC; --border:#2A3C57;
  --accent:#4C95F5; --accent-soft:#1E3556; --accent-2:#4C95F5;
  --ok:#4CC27E; --ok-bg:#16362A; --danger:#FF6B6F; --danger-bg:#3A1F24; --shadow:rgba(0,0,0,0.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.brand span{font-weight:500;font-size:.8rem;color:var(--ink-soft);}
.topbar-actions{display:flex;gap:8px;}
.theme-toggle{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:10px;padding:7px 12px;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap;}
.app{max-width:1180px;margin:0 auto;padding:20px 24px 60px;}
.steps{display:flex;align-items:center;padding:14px 4px 22px;overflow-x:auto;scrollbar-width:none;}
.steps::-webkit-scrollbar{display:none;}
.step-btn{display:flex;align-items:center;gap:10px;border:none;background:none;padding:4px 2px;cursor:pointer;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex:none;}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);flex:none;}
.step-btn.active{color:var(--accent);}
.step-btn.active .step-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.step-btn.done{color:var(--ok);}
.step-btn.done .step-num{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok);}
.step-line{flex:1 1 24px;min-width:18px;height:1.5px;background:var(--border);margin:0 12px;}
main{background:var(--panel);border-radius:22px;padding:28px 32px 36px;}
h1.page-title{font-size:1.45rem;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
p.page-sub{color:var(--ink-soft);margin:0 0 22px;max-width:70ch;line-height:1.5;font-size:.92rem;}
.card{background:var(--surface);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px var(--shadow);}
.card h2{font-size:1.05rem;font-weight:700;margin:0 0 14px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.card-head h2{margin:0;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.field label{font-size:.78rem;color:var(--ink-soft);font-weight:500;}
input[type=text],input[type=number],select{font:inherit;font-size:.9rem;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-height:40px;max-width:100%;}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
button{font-family:inherit;cursor:pointer;}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:.88rem;font-weight:600;min-height:40px;}
.btn:hover{background:var(--surface-2);}
.btn-primary,.btn-gold{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover,.btn-gold:hover{filter:brightness(1.07);background:var(--accent);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn-sm{padding:6px 12px;font-size:.8rem;min-height:32px;border-radius:8px;}
.btn-add{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem;}
th,td{border-bottom:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:middle;}
th{background:var(--surface-2);font-weight:600;font-size:.78rem;color:var(--ink-soft);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;background:var(--surface);}
.muted{color:var(--ink-soft);font-size:.82rem;}
.warn-box{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:12px 16px;font-size:.86rem;margin-bottom:16px;}
.ok-box{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 16px;font-size:.86rem;margin-bottom:16px;}
.note-box{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:.86rem;margin-bottom:16px;}
.issue-link{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap;margin-left:6px;}
.sched-select{width:100%;min-width:130px;font-size:.78rem;padding:6px 8px;min-height:34px;}
td.conflict{background:var(--danger-bg);}
.tabs-inline{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.pill-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:.84rem;font-weight:500;white-space:nowrap;color:var(--ink);}
.pill-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.cov-ok{color:var(--ok);font-weight:600;}
.cov-bad{color:var(--danger);font-weight:600;}
.icon-btn{background:none;border:none;color:var(--ink-soft);font-size:1rem;padding:6px;border-radius:8px;}
.icon-btn:hover{color:var(--danger);background:var(--danger-bg);}
footer.hint,.hint{font-size:.78rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
.parallel{border-top:1px solid var(--border);padding:14px 0;}
.parallel:first-of-type{border-top:none;}
.parallel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.parallel-title{font-weight:700;font-size:.98rem;min-width:70px;}
.parallel-days{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-soft);}
.parallel-days select{min-height:32px;padding:4px 8px;}
.class-list{display:flex;flex-direction:column;gap:8px;}
.class-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.class-row .class-name-input{width:110px;font-weight:600;}
.mini{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--ink-soft);}
.mini select,.mini input{min-height:34px;padding:5px 8px;font-size:.84rem;}
.class-row .icon-btn{margin-left:auto;}
@media (max-width:720px){
  body{font-size:14px;}
  .topbar-inner{padding:10px 14px;}
  .brand span{display:none;}
  .app{padding:8px 10px 40px;}
  .steps{padding:10px 4px 14px;}
  .step-btn .step-label{display:none;}
  .step-btn.active .step-label{display:inline;}
  .step-line{min-width:12px;margin:0 6px;}
  main{padding:18px 14px 24px;border-radius:16px;}
  h1.page-title{font-size:1.2rem;}
  .card{padding:14px;}
  .row{flex-direction:column;align-items:stretch;}
  .field{min-width:0;width:100%;}
  .row .btn{width:100%;}
  .class-row{padding:10px;}
  .class-row .class-name-input{width:100%;}
  .mini{flex:1 1 44%;}
  .mini select,.mini input{width:100%;}
  th,td{padding:8px;}
}
.bot{background:var(--surface);border-radius:18px;padding:16px 18px;margin:0 0 6px;box-shadow:0 1px 2px var(--shadow);border:1px solid var(--border);}
.bot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.bot-title{font-weight:800;font-size:1rem;}
.bot-title span{font-weight:500;color:var(--ink-soft);font-size:.82rem;margin-left:6px;}
.bot-head-actions{display:flex;gap:8px;align-items:center;}
.bot-progress{font-size:.78rem;color:var(--ink-soft);}
.bot-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;margin:14px 0 12px;padding-right:4px;}
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.45;white-space:pre-line;}
.bubble.bot{background:var(--panel);color:var(--ink);border-top-left-radius:4px;align-self:flex-start;}
.bubble.me{background:var(--accent);color:#fff;border-top-right-radius:4px;align-self:flex-end;}
.bot-actions{display:flex;flex-wrap:wrap;gap:8px;}
.bot-actions .btn{min-width:48px;}
.bot-file{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.subj-name-input{width:100%;min-width:min(380px,70vw);}
.search-input{min-width:min(280px,100%);}
.variant-select{min-width:min(240px,100%);font-weight:500;}
.class-row .class-name-input{width:160px;}
@media (max-width:720px){
  .bubble{max-width:92%;}
  .bot{padding:12px;}
  .bot-title span{display:none;}
  .subj-name-input{min-width:220px;}
}
</style>
</head>

function classPlanSource(cls){
  if(!cls || !cls.grade || cls.grade < 5) return { kind: null };
  if(cls.variativ && cls.grade >= 7){

    if(tb) return { kind: "227", key: cls.variativ, table: tb };

    if(state.config.schoolType !== "criterial") return { kind: "base", missing: "183", reason: "school" };

function orderPlanRows(cls, src){

    var r = { name: name, hours: hours, unofficial: false }; byName[name] = r; out.push(r);
  }
  src.table.r.forEach(function(row){
    var uzName = ORDER_PLANS.n[row[0]], part2 = row[1] === 1, h = row[2+gi];
    if(!(h > 0)) return;

    var name = base;

/* Домашнее обучение живёт в своём диапазоне периодов, после обеих смен —
   у него нет "смены" в обычном смысле, поэтому оффсет считается отдельно. */
var MAX_SHIFTS = 3;
function classShift(cls){
  if(!cls) return 1;
  if(cls.shiftOverride) return cls.shiftOverride;
  var p = (state.config.parallels && cls.grade) ? state.config.parallels[cls.grade] : null;
  if(p && p.shift) return p.shift;
  return cls.shift || 1;
}
/* Сколько смен реально используется — максимум по обычным (не ДО) классам.
   Отдельной школьной настройки нет: в одной школе бывает 1, 2 или 3 смены. */
function shiftsInUse(){
  var m = 1;
  state.classes.forEach(function(c){ if(!c.isHomeschool){ var s = classShift(c); if(s > m) m = s; } });
  return Math.min(m, MAX_SHIFTS);
}
function parallelPeriods(grade){
  var p = (state.config.parallels && grade) ? state.config.parallels[grade] : null;
  return (p && p.periods) || state.config.periodsPerShift || 6;
}
function classPeriods(cls){
  if(!cls) return state.config.periodsPerShift || 6;
  if(cls.periodsOverride) return cls.periodsOverride;
  if(cls.isHomeschool) return state.config.homeschoolPeriodsPerDay || 3;
  return parallelPeriods(cls.grade);
}
/* Ось слотов дня: смены идут подряд, ширина смены = максимум уроков у её классов,
   ДО — после всех смен. Классы с разным числом уроков не наезжают на соседнюю смену,
   а занятость учителя проверяется по всей школе. */
function slotLayout(){
  var widths = [0,0,0,0], hoWidth = 0;
  state.classes.forEach(function(c){
    var n = classPeriods(c);
    if(c.isHomeschool){ if(n > hoWidth) hoWidth = n; }
    else { var s = classShift(c); if(n > widths[s]) widths[s] = n; }
  });
  var offsets = [0,0,0,0], acc = 0;
  for(var k=1; k<=MAX_SHIFTS; k++){ offsets[k] = acc; acc += widths[k]; }
  return { offsets: offsets, hoOffset: acc, total: acc + hoWidth };
}
function totalSlotsPerDay(){ return slotLayout().total; }
function shiftOffset(shift){ return slotLayout().offsets[shift] || 0; }
function classPeriodInfo(cls){
  if(cls && cls.isHomeschool){
    return { offset: slotLayout().hoOffset, periodsPerDay: classPeriods(cls) };
  }
  return { offset: shiftOffset(classShift(cls)), periodsPerDay: classPeriods(cls) };
}

/* A "unit" is one placeable lesson-slot in a class's plan: normally a single
   subject+teacher, or — when two curriculum rows are linked via syncWith —
   a group lesson where both members always occupy the exact same slot.
   Shared by the generator and by the manual schedule-editing dropdown so
   both agree on what a "lesson" is. */
function computeUnits(classId){
  var plan = state.curriculum[classId] || {};
  var processed = {};
  var units = [];
  Object.keys(plan).forEach(function(subjId){
    if(processed[subjId]) return;
    var entry = plan[subjId];
    if(!entry || !(entry.hours>0)) return;
    var members = [{ subjectId: subjId, teacherId: entry.teacherId }];
    processed[subjId] = true;
    var partnerId = entry.syncWith;
    // партнёр без учителя остаётся в паре: группы всегда в одном слоте, даже если учитель ещё не назначен
    if(partnerId && plan[partnerId] && plan[partnerId].hours>0 && !processed[partnerId]){
      members.push({ subjectId: partnerId, teacherId: plan[partnerId].teacherId });
      processed[partnerId] = true;
    }
    units.push({
      key: members.map(function(m){ return m.subjectId; }).sort().join("+"),
      members: members,
      hours: entry.hours,
      blockSize: entry.blockSize || 1
    });
  });
  return units;
}

/* Справочник ЕСП обновляется вместе с кодом, а в сохранённых данных лежит копия
   на момент первого запуска. Доливаем недостающие предметы по названию, не трогая
   существующие (их id уже используются в учебных планах и расписании). */
/* Старые названия предметов, исправленные в справочнике ЕСП: предмет со старым
   названием сливается с правильным, ссылки в учебных планах переносятся. */
function migrateLegacySubjects(st){
  // объявлено внутри функции: она вызывается ещё при загрузке, до выполнения кода ниже по файлу
  var LEGACY_SUBJECT_RENAMES = { "Естесвознание Жасорат": "Естествознание Жасорат" };
  Object.keys(LEGACY_SUBJECT_RENAMES).forEach(function(oldName){
    var newName = LEGACY_SUBJECT_RENAMES[oldName];
    var olds = st.subjects.filter(function(s){ return s.name === oldName; });
    if(!olds.length) return;
    var target = st.subjects.filter(function(s){ return s.name === newName; })[0];
    olds.forEach(function(os){
      if(!target){ os.name = newName; target = os; return; }
      Object.keys(st.curriculum || {}).forEach(function(cid){
        var pl = st.curriculum[cid];
        if(pl[os.id] && !pl[target.id]){
          pl[target.id] = pl[os.id]; delete pl[os.id];
          Object.keys(pl).forEach(function(k){ if(pl[k].syncWith === os.id) pl[k].syncWith = target.id; });
        }
      });
      (st.teachers || []).forEach(function(tc){
        var i = tc.subjects.indexOf(os.id);
        if(i >= 0){ tc.subjects.splice(i, 1); if(tc.subjects.indexOf(target.id) < 0) tc.subjects.push(target.id); }
      });
      var stillUsed = Object.keys(st.curriculum || {}).some(function(cid){ return !!st.curriculum[cid][os.id]; });
      if(!stillUsed) st.subjects = st.subjects.filter(function(s){ return s !== os; });
    });
  });
}
function ensureCatalog(st){
  if(!st || !st.subjects) return;
  migrateLegacySubjects(st);
  var byName = {};
  st.subjects.forEach(function(s){ byName[s.name] = s; });
  REAL_SUBJECT_CATALOG.forEach(function(c){
    var ex = byName[c.name];
    if(ex){
      if(ex.espId == null && c.espId != null) ex.espId = c.espId;
      if(ex.erpId == null && c.erpId != null) ex.erpId = c.erpId;
      if(!ex.nameUz && c.nameUz) ex.nameUz = c.nameUz;
    } else {
      var s = { id: uid("subj"), name: c.name, nameUz: c.nameUz || null, espId: c.espId, erpId: c.erpId, roomType: null, heavy: false };
      st.subjects.push(s); byName[c.name] = s;
    }
  });
}

    html += uzt('<div class="warn-box"><strong>Прежде чем генерировать расписание, исправьте:</strong><ul style="margin:6px 0 0 18px; padding:0;">');

      html += '<li>'+escHtml(className(u.classId))+' — '+escHtml(subjectName(u.subjectId))+' ('+escHtml(teacherName(u.teacherId))+')</li>';

/* ---------------- validation ---------------- */
/* Проверки перед генерацией. errors — генерация невозможна; warnings — генерация
   возможна, но результат будет неполным или без проверки занятости учителей.
   У каждой проблемы есть шаг мастера (и класс), где её исправлять: туда ведут
   ссылки на вкладке «Расписание» и кнопки бота. */
function generationIssues(){
  var errors = [], warnings = [];
  function add(list, text, tab, classId){
    if(!list.some(function(x){ return x.text === text; })) list.push({ text: text, tab: tab, classId: classId || null });
  }
  if(!state.classes.length) add(errors, uzt("Нет ни одного класса."), "classes");
  if(!state.subjects.length) add(errors, uzt("Нет ни одного предмета."), "subjects");

  var neededRoomTypes = {}, emptyClasses = [], anyPlan = false, noTeacherCount = 0, firstNoTeacherClass = null;
  state.classes.forEach(function(c){
    var plan = state.curriculum[c.id] || {};
    var any = false;
    Object.keys(plan).forEach(function(subjId){
      var e = plan[subjId];
      if(!(e.hours > 0)) return;
      any = true;
      if(!e.teacherId){ noTeacherCount++; if(!firstNoTeacherClass) firstNoTeacherClass = c.id; }
      var subj = byId(state.subjects, subjId);
      if(subj && subj.roomType) neededRoomTypes[subj.roomType] = true;
      if(e.syncWith && plan[e.syncWith] && plan[e.syncWith].hours !== e.hours){
        add(errors, uzt('Класс ')+c.name+uzt(': групповой урок «')+subjectName(subjId)+uzt('» и «')+subjectName(e.syncWith)+uzt('» — разное число часов (')+e.hours+uzt(' и ')+plan[e.syncWith].hours+uzt('), должно совпадать.'), "curriculum", c.id);
      }
    });
    if(any) anyPlan = true; else emptyClasses.push(c);
  });
  // классы без плана не блокируют всю школу — они просто не попадут в расписание
  if(state.classes.length && !anyPlan){
    add(errors, uzt("Ни у одного класса нет учебного плана — заполните его на шаге «Учебный план»."), "curriculum", state.classes[0].id);
  } else if(emptyClasses.length){
    add(warnings, uzt("Без учебного плана, в расписание не попадут: ")+emptyClasses.map(function(c){ return c.name; }).join(", ")+".", "curriculum", emptyClasses[0].id);
  }

  if(state.rooms.length){
    Object.keys(neededRoomTypes).forEach(function(rt){
      if(!state.rooms.some(function(r){ return r.type === rt; })){
        add(errors, uzt('Ни одного кабинета с типом «')+rt+uzt('» не заведено, а он нужен по крайней мере одному предмету.'), "rooms");
      }
    });
  }

  // без учителей расписание строится (как черновик) — проверяются только классы и кабинеты
  if(!state.teachers.length){
    add(warnings, uzt("Учителей нет — расписание строится без учителей, их занятость не проверяется. Добавьте учителей и составьте расписание заново."), "teachers");
  } else if(noTeacherCount){
    add(warnings, uzt("Предметов в учебных планах без учителя: ")+noTeacherCount+uzt(" — для них занятость учителя не проверяется. Назначьте учителей в учебном плане."), "curriculum", firstNoTeacherClass);
  }

  var teacherLoad = {};
  state.classes.forEach(function(c){
    var plan = state.curriculum[c.id] || {};
    Object.keys(plan).forEach(function(subjId){
      var e = plan[subjId];
      if(e.hours>0 && e.teacherId) teacherLoad[e.teacherId] = (teacherLoad[e.teacherId]||0) + e.hours;
    });
  });
  state.teachers.forEach(function(t){
    var cap = t.maxPerDay * 6; // безопасная верхняя граница — учитель может вести и 6-дневные классы
    var load = teacherLoad[t.id] || 0;
    if(load > cap){
      add(warnings, uzt('Учитель ')+t.name+uzt(': назначено ')+load+uzt('ч/нед при максимуме ')+cap+uzt('ч (')+t.maxPerDay+uzt('×6 дн.) — не хватит слотов.'), "teachers");
    }
  });

  return { errors: errors, warnings: warnings };
}

function findOrCreateSubject(name){
  var existing = state.subjects.filter(function(s){ return s.name === name; })[0];
  if(existing) return existing.id;
  var s = { id: uid("subj"), name: name, nameUz: catalogUzName(name), espId: null, erpId: null, roomType: null, heavy: false };

/* Resolves the official Sxema_KTP grid for one class's parameters into a flat
   list of {name, hours, unofficial}. Shared by the bulk autofill button and
   by the single manual "add subject" control, so both agree on the numbers. */
function computeOfficialPlan(cls){
  var result = [];
  var src = classPlanSource(cls);
  if(src.kind === "227" || src.kind === "183") return orderPlanRows(cls, src);
  if(src.kind !== "base") return result;

  // базовая сетка КТП; профили 10–11 теперь берутся из таблиц приказа №183 (выше)
  var g = String(cls.grade);
  var trackKey = null;

  KTP_GRID.forEach(function(row){
    if(row.langGroup){
      var matches =
        (row.langGroup==="uz_medium" && cls.instructionLang==="uz") ||
        (row.langGroup==="state_ru_qr" && (cls.instructionLang==="ru" || cls.instructionLang==="qr")) ||
        (row.langGroup==="ru_medium" && cls.instructionLang==="ru") ||
        (row.langGroup==="qr_medium" && cls.instructionLang==="qr");
      if(!matches) return;
    }
    if(row.choiceGroup==="first_foreign" && row.choiceValue !== cls.firstForeignLang) return;
    if(row.choiceGroup==="second_foreign" && row.choiceValue !== cls.secondForeignLang) return;
    if(row.techVariant){
      var mode = cls.technologyMode || "split";
      var keep = (mode==="split" && (row.techVariant==="boys" || row.techVariant==="girls")) ||
                 (mode==="unified" && row.techVariant==="unified") ||
                 (mode==="agro" && row.techVariant==="agro");
      if(!keep) return;
    }

    var hours = null;
    if(trackKey && row.tracks[trackKey] && row.tracks[trackKey][g] !== undefined){
      hours = row.tracks[trackKey][g];
    } else if(row.base[g] !== undefined){
      hours = row.base[g];
    }
    if(hours === null) return;

    var subjectDisplayName = row.subject;
    var unofficial = false;
    var baseHours = row.base[g];
    if(cls.jasorat && (cls.grade===5 || cls.grade===6) && JASORAT_MAP[subjectDisplayName]){
      subjectDisplayName = JASORAT_MAP[subjectDisplayName];
      unofficial = true;
    } else if(TRACK_SUBJECT_VARIANTS[cls.track] && TRACK_SUBJECT_VARIANTS[cls.track][subjectDisplayName] &&
              baseHours !== undefined && hours !== baseHours){
      subjectDisplayName = TRACK_SUBJECT_VARIANTS[cls.track][subjectDisplayName];
    }
    result.push({ name: subjectDisplayName, hours: hours, unofficial: unofficial });
  });
  return result;
}

function autofillCurriculum(classId, opts){
  track("autofill_plan");
  var cls = byId(state.classes, classId);
  var officialRows = computeOfficialPlan(cls);
  if(!officialRows.length) return;

  var oldPlan = state.curriculum[classId] || {};
  var newPlan = {};
  officialRows.forEach(function(row){
    var subjId = findOrCreateSubject(row.name);
    var prevEntry = oldPlan[subjId];
    newPlan[subjId] = {
      hours: row.hours,
      teacherId: prevEntry ? prevEntry.teacherId : null,
      unofficial: row.unofficial,
      blockSize: prevEntry ? (prevEntry.blockSize||1) : 1,
      syncWith: null
    };
  });

  if((cls.technologyMode||"split")==="split"){
    var boysId = findOrCreateSubject("Технология (мальчики)");
    var girlsId = findOrCreateSubject("Технология (девочки)");
    if(newPlan[boysId] && newPlan[girlsId]){
      newPlan[boysId].syncWith = girlsId;
      newPlan[girlsId].syncWith = boysId;
    }
  }

  state.curriculum[classId] = newPlan;
  // при автозаполнении «на просмотре» готовое расписание не стираем: план класса был пуст,
  // расписание просто станет неполным, а сверка с планом это покажет
  if(!(opts && opts.keepSchedule)) state.schedule = null;
  cls.officialPlanApplied = true;
}

/* ---------------- conflict detection (for manual edits) ---------------- */
function computeConflicts(){
  var conflicts = new Set();
  var teacherSlot = {}; // teacherId|day|globalSlot -> [ "classId|day|period", ... ]
  state.classes.forEach(function(c){
    var offset = classPeriodInfo(c).offset;
    var sched = state.schedule.byClass[c.id];
    if(!sched) return;
    sched.forEach(function(dayArr, d){
      dayArr.forEach(function(cell, p){
        if(!cell || !cell.lessons) return;
        var slot = offset + p;
        cell.lessons.forEach(function(lesson){
          if(!lesson.teacherId) return;
          var key = lesson.teacherId+"|"+d+"|"+slot;
          if(!teacherSlot[key]) teacherSlot[key] = [];
          teacherSlot[key].push(c.id+"|"+d+"|"+p);
        });
      });
    });
  });
  Object.keys(teacherSlot).forEach(function(k){
    if(teacherSlot[k].length > 1){
      teacherSlot[k].forEach(function(cellKey){ conflicts.add(cellKey); });
    }
  });
  return conflicts;
}

/* ---------------- scheduling engine ---------------- */
function mulberry32(seed){
  return function(){
    var t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function collectLockedCells(){
  var locked = [];
  if(!state.schedule) return locked;
  state.classes.forEach(function(c){
    var sched = state.schedule.byClass[c.id];
    if(!sched) return;
    sched.forEach(function(dayArr, d){
      dayArr.forEach(function(cell, p){
        if(cell && cell.locked) locked.push({ classId:c.id, day:d, period:p, cell:cell });
      });
    });
  });
  return locked;
}

function generateSchedule(){
  var lockedCells = collectLockedCells();
  var bestResult = null;
  var ATTEMPTS = 40;
  for(var attempt=0; attempt<ATTEMPTS; attempt++){
    var result = tryBuildOnce(attempt, lockedCells);
    if(!bestResult || result.unplaced.length < bestResult.unplaced.length){
      bestResult = result;
      if(bestResult.unplaced.length === 0) break;
    }
  }
  state.schedule = {
    byClass: bestResult.byClass,
    unplaced: bestResult.unplaced,
    unplacedCount: bestResult.unplaced.length
  };
}

var MAX_DAYS = 6; // безопасная верхняя граница для сеток занятости — конкретный класс может использовать меньше

function tryBuildOnce(seed, lockedCells){
  var rng = mulberry32(seed*97 + 13);
  var slots = totalSlotsPerDay();
  var hasRooms = state.rooms.length > 0;

  var teacherBusy = {}; // teacherId -> [day][slot] = classId or null
  state.teachers.forEach(function(t){
    teacherBusy[t.id] = [];
    for(var d=0; d<MAX_DAYS; d++){ teacherBusy[t.id].push(new Array(slots).fill(null)); }
  });
  var teacherDayCount = {}; // teacherId -> [day] lessons count
  state.teachers.forEach(function(t){ teacherDayCount[t.id] = new Array(MAX_DAYS).fill(0); });

  var roomBusy = {}; // roomId -> [day][slot] = classId or null
  state.rooms.forEach(function(r){
    roomBusy[r.id] = [];
    for(var d=0; d<MAX_DAYS; d++){ roomBusy[r.id].push(new Array(slots).fill(null)); }
  });

  var byClass = {};
  state.classes.forEach(function(c){
    var pinfo = classPeriodInfo(c);
    byClass[c.id] = [];
    for(var d=0; d<classDays(c); d++){ byClass[c.id].push(new Array(pinfo.periodsPerDay).fill(null)); }
  });

  // Pre-seed locked cells before anything else is placed, so the generator
  // treats them as already-occupied ground truth and never moves or reuses them.
  var lockedHoursByClassSubject = {}; // "classId|subjectId" -> count
  (lockedCells||[]).forEach(function(lc){
    if(!byClass[lc.classId]) return;
    var cls = byId(state.classes, lc.classId);
    var offset = classPeriodInfo(cls).offset;
    byClass[lc.classId][lc.day][lc.period] = lc.cell;
    var globalSlot = offset + lc.period;
    lc.cell.lessons.forEach(function(lesson){
      if(!lesson.teacherId) return;
      if(teacherBusy[lesson.teacherId]) teacherBusy[lesson.teacherId][lc.day][globalSlot] = lc.classId;
      if(teacherDayCount[lesson.teacherId] !== undefined) teacherDayCount[lesson.teacherId][lc.day]++;
      if(lesson.roomId && roomBusy[lesson.roomId]) roomBusy[lesson.roomId][lc.day][globalSlot] = lc.classId;
      var key = lc.classId+"|"+lesson.subjectId;
      lockedHoursByClassSubject[key] = (lockedHoursByClassSubject[key]||0) + 1;
    });
  });

  var unplaced = [];
  var classOrder = shuffle(state.classes, rng);

  classOrder.forEach(function(cls){
    var pinfo = classPeriodInfo(cls);
    var offset = pinfo.offset;
    var periodsPerDay = pinfo.periodsPerDay;
    var days = classDays(cls);

    var units = computeUnits(cls.id).map(function(u){
      var already = lockedHoursByClassSubject[cls.id+"|"+u.members[0].subjectId] || 0;
      return { key:u.key, members:u.members, blockSize:u.blockSize, hours: Math.max(0, u.hours - already) };
    }).filter(function(u){ return u.hours > 0; });
    units.sort(function(a,b){ return b.hours - a.hours; });

    var dayLoad = new Array(days).fill(0);

    units.forEach(function(unit){
      var blockSize = unit.blockSize || 1;
      // Дробные часы (0.5, 1.5...) реальны в официальных планах (напр. Астрономия
      // 0,5ч/нед — по факту "раз в две недели"); в статичной недельной сетке это
      // округляется вверх до целого слота, а дробность остаётся только в отчётности.
      var totalSlotsNeeded = Math.ceil(unit.hours);
      var occurrences = Math.floor(totalSlotsNeeded / blockSize);
      var leftover = totalSlotsNeeded - occurrences*blockSize;
      var placements = [];
      for(var i=0;i<occurrences;i++) placements.push(blockSize);
      for(var j=0;j<leftover;j++) placements.push(1);

      var dayOrderBase = shuffle(range(days), rng);
      var usedDaysForUnit = {};

      placements.forEach(function(size){
        var placed = false;
        for(var pass=0; pass<3 && !placed; pass++){
          var dayOrder = dayOrderBase.slice().sort(function(a,b){ return dayLoad[a]-dayLoad[b]; });
          for(var di=0; di<dayOrder.length && !placed; di++){
            var d = dayOrder[di];
            if(pass<2 && usedDaysForUnit[d]) continue;

            var teacherOk = unit.members.every(function(m){
              if(!m.teacherId) return true; // урок без учителя — временных ограничений по учителю нет
              var teacher = byId(state.teachers, m.teacherId);
              if(!teacher) return false;
              if(teacher.daysOff[d]) return false;
              if(teacherDayCount[m.teacherId][d] + size > teacher.maxPerDay) return false;
              return true;
            });
            if(!teacherOk) continue;

            var maxStart = periodsPerDay - size;
            if(maxStart < 0) continue;
            var periodStarts = shuffle(range(maxStart+1), rng);

            for(var si=0; si<periodStarts.length && !placed; si++){
              var start = periodStarts[si];
              var periodsList = [];
              for(var k=0;k<size;k++) periodsList.push(start+k);

              var classFree = periodsList.every(function(p){ return !byClass[cls.id][d][p]; });
              if(!classFree) continue;

              var globalSlots = periodsList.map(function(p){ return offset+p; });
              var teachersFree = unit.members.every(function(m){
                if(!m.teacherId) return true;
                return globalSlots.every(function(slot){ return !teacherBusy[m.teacherId][d][slot]; });
              });
              if(!teachersFree) continue;

              var roomAssignment = {};
              var roomsOk = true;
              if(hasRooms){
                for(var mi=0; mi<unit.members.length; mi++){
                  var subj = byId(state.subjects, unit.members[mi].subjectId);
                  if(subj && subj.roomType){
                    var candidates = state.rooms.filter(function(r){
                      return r.type === subj.roomType && (!cls.studentCount || r.capacity >= cls.studentCount);
                    });
                    if(!candidates.length){ roomsOk = false; break; }
                    var chosen = candidates.filter(function(r){
                      return globalSlots.every(function(slot){ return !roomBusy[r.id][d][slot]; });
                    })[0];
                    if(!chosen){ roomsOk = false; break; }
                    roomAssignment[unit.members[mi].subjectId] = chosen.id;
                  } else {
                    roomAssignment[unit.members[mi].subjectId] = null;
                  }
                }
              } else {
                unit.members.forEach(function(m){ roomAssignment[m.subjectId] = null; });
              }
              if(!roomsOk) continue;

              var lessons = unit.members.map(function(m){
                return { subjectId: m.subjectId, teacherId: m.teacherId, roomId: roomAssignment[m.subjectId] };
              });
              periodsList.forEach(function(p){ byClass[cls.id][d][p] = { lessons: lessons, locked: false }; });
              unit.members.forEach(function(m){
                if(!m.teacherId) return;
                globalSlots.forEach(function(slot){ teacherBusy[m.teacherId][d][slot] = cls.id; });
                teacherDayCount[m.teacherId][d] += size;
                var rId = roomAssignment[m.subjectId];
                if(rId){ globalSlots.forEach(function(slot){ roomBusy[rId][d][slot] = cls.id; }); }
              });
              dayLoad[d] += size;
              usedDaysForUnit[d] = true;
              placed = true;
            }
          }
        }
        if(!placed){
          unit.members.forEach(function(m){
            unplaced.push({ classId: cls.id, subjectId: m.subjectId, teacherId: m.teacherId });
          });
        }
      });
    });
  });

  return { byClass: byClass, unplaced: unplaced };
}
function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }

/* ---------------- eMaktab staff export parser ----------------
   The "reportStaff...xls" eMaktab export is actually an HTML table
   (Excel opens it via content-sniffing), not a real .xls binary.
   Columns seen in a real export: №, ФИО, Пол, Дата рождения, ПИНФЛ,
   Должность, Классы, Телефоны, Эл. почта. We only keep ФИО and Классы. */
function parseStaffExport(text){
  track("staff_import");
  var doc = new DOMParser().parseFromString(text, "text/html");
  var table = doc.querySelector("table");
  if(!table) return null;
  var trs = table.querySelectorAll("tr");
  if(!trs.length) return null;
  var headerCells = Array.prototype.map.call(trs[0].querySelectorAll("td,th"), function(c){
    return c.textContent.replace(/\u00a0/g," ").trim();
  });
  var nameIdx = headerCells.indexOf("ФИО");
  var classesIdx = headerCells.indexOf("Классы");
  if(nameIdx === -1) return null;
  var out = [];
  for(var i=1; i<trs.length; i++){
    var cells = Array.prototype.map.call(trs[i].querySelectorAll("td,th"), function(c){
      return c.textContent.replace(/\u00a0/g," ").trim();
    });
    if(cells.length <= nameIdx) continue;
    var name = cells[nameIdx];
    if(!name) continue;
    out.push({ name: name, classesRaw: classesIdx!==-1 ? (cells[classesIdx]||"") : "" });
  }
  return out;
}

/* ---------------- excel export ---------------- */
function cellLabel(cell){
  if(!cell || !cell.lessons || !cell.lessons.length) return "";
  return cell.lessons.map(function(lesson){
    var s = subjectName(lesson.subjectId)+" / "+teacherName(lesson.teacherId);
    if(lesson.roomId) s += " ["+roomName(lesson.roomId)+"]";
    return s;
  }).join("  ‖  ");
}
function buildWorkbook(){
  var wb = XLSX.utils.book_new();
  var daysAll = DAY_NAMES_6;
  state.classes.forEach(function(c){
    var days = classDayNames(c);
    var pinfo = classPeriodInfo(c);
    var aoa = [];
    aoa.push([uzt("Урок")].concat(days));
    for(var p=0; p<pinfo.periodsPerDay; p++){
      var row = [String(p+1)];
      for(var d=0; d<days.length; d++){
        row.push(cellLabel(state.schedule.byClass[c.id][d][p]));
      }
      aoa.push(row);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(c.name));
  });

  var slots = totalSlotsPerDay();
  state.teachers.forEach(function(t){
    var aoa = [[uzt("Слот")].concat(daysAll)];
    for(var slot=0; slot<slots; slot++){
      var row = [String(slot+1)];
      for(var d=0; d<daysAll.length; d++){
        var occ = "";
        state.classes.forEach(function(c){
          if(d >= classDays(c)) return;
          var pinfo2 = classPeriodInfo(c);
          var localP = slot - pinfo2.offset;
          if(localP < 0 || localP >= pinfo2.periodsPerDay) return;
          var cell = state.schedule.byClass[c.id][d][localP];
          if(!cell || !cell.lessons) return;
          var lesson = cell.lessons.filter(function(l){ return l.teacherId === t.id; })[0];
          if(lesson) occ = c.name + " / " + subjectName(lesson.subjectId) + (lesson.roomId ? " ["+roomName(lesson.roomId)+"]" : "");
        });
        row.push(occ);
      }
      aoa.push(row);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(uzt("Уч. ")+t.name));
  });

  if(state.rooms.length){
    var aoaR = [[uzt("Слот")].concat(daysAll)];
    for(var slot2=0; slot2<slots; slot2++){
      var rowR = [String(slot2+1)];
      for(var d2=0; d2<daysAll.length; d2++){
        var occR = [];
        state.classes.forEach(function(c){
          if(d2 >= classDays(c)) return;
          var pinfo3 = classPeriodInfo(c);
          var localP2 = slot2 - pinfo3.offset;
          if(localP2 < 0 || localP2 >= pinfo3.periodsPerDay) return;
          var cellR = state.schedule.byClass[c.id][d2][localP2];
          if(!cellR || !cellR.lessons) return;
          cellR.lessons.forEach(function(lesson){
            if(lesson.roomId) occR.push(roomName(lesson.roomId)+": "+c.name+"/"+subjectName(lesson.subjectId));
          });
        });
        rowR.push(occR.join("; "));
      }
      aoaR.push(rowR);
    }
    var wsR = XLSX.utils.aoa_to_sheet(aoaR);
    XLSX.utils.book_append_sheet(wb, wsR, safeSheetName(uzt("Кабинеты")));
  }
  return wb;
}
function safeSheetName(name){
  var n = String(name).replace(/[\\\/\?\*\[\]:]/g, " ").trim();
  return n.substring(0,31) || "Sheet";
}

/* ---------------- event binding ---------------- */
function bindGlobalActions(){
  var main = document.getElementById("main");

  // classes tab config
  var cfgDays = document.getElementById("cfg-days");
  if(cfgDays) cfgDays.onchange = function(){ state.config.days = parseInt(this.value,10); state.schedule=null; render(); };
  var cfgShifts = document.getElementById("cfg-shifts");
  if(cfgShifts) cfgShifts.onchange = function(){
    state.config.shifts = parseInt(this.value,10);
    if(state.config.shifts===1) state.classes.forEach(function(c){ c.shift=1; });
    state.schedule=null; render();
  };
  var cfgPeriods = document.getElementById("cfg-periods");
  if(cfgPeriods) cfgPeriods.onchange = function(){ state.config.periodsPerShift = Math.max(3, parseInt(this.value,10)||6); state.schedule=null; render(); };
  var cfgHoPeriods = document.getElementById("cfg-ho-periods");
  if(cfgHoPeriods) cfgHoPeriods.onchange = function(){ state.config.homeschoolPeriodsPerDay = Math.max(1, parseInt(this.value,10)||3); state.schedule=null; render(); };
  var cfgSchoolType = document.getElementById("cfg-schooltype");
  if(cfgSchoolType) cfgSchoolType.onchange = function(){ state.config.schoolType = this.value; render(); };

  main.addEventListener("click", onClick);
  main.addEventListener("change", onChange);
  main.addEventListener("keydown", onMainKeydown);
  main.addEventListener("input", onMainInput);

  var importStaffInput = document.getElementById("import-staff-input");
  if(importStaffInput){
    importStaffInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        var summary = document.getElementById("import-staff-summary");
        var rows;
        try{ rows = parseStaffExport(evt.target.result); }
        catch(err){ rows = null; }
        if(!rows || !rows.length){
          if(summary) summary.innerHTML = uzt('<div class="warn-box" style="margin-top:12px;">Не удалось распознать таблицу в файле. Ожидается отчёт «Сотрудники», выгруженный из eMaktab как есть, без пересохранения.</div>');
          return;
        }
        var addedTeachers = 0, skippedTeachers = 0;
        var newClassNames = {};
        rows.forEach(function(r){
          if(!r.name) return;
          var exists = state.teachers.some(function(t){ return t.name.trim().toLowerCase() === r.name.trim().toLowerCase(); });
          if(exists){ skippedTeachers++; return; }
          state.teachers.push({
            id: uid("teach"), name: r.name, subjects: [], maxPerDay: 5,
            daysOff: new Array(MAX_DAYS).fill(false),
            homeroomNote: r.classesRaw || ""
          });
          addedTeachers++;
          if(r.classesRaw){
            r.classesRaw.split(/[,;]/).forEach(function(tok){
              var name = tok.trim();
              if(name) newClassNames[name] = true;
            });
          }
        });
        var addedClasses = 0;
        Object.keys(newClassNames).forEach(function(name){
          var exists = state.classes.some(function(c){ return c.name.trim().toLowerCase() === name.toLowerCase(); });
          if(!exists){
            var gGuess = null; var gm = name.match(/\d+/);
            if(gm){ var gn = parseInt(gm[0],10); if(gn>=1 && gn<=11) gGuess = gn; }
            state.classes.push({
              id: uid("class"), name: name, shift: 1,
              grade: gGuess, instructionLang: "uz",
              jasorat: false, track: "none", trackLang: "uz",
              firstForeignLang: "english", secondForeignLang: "english", technologyMode: "split", studentCount: null, daysOverride: null, isHomeschool: false
            });
            addedClasses++;
          }
        });
        if(summary){
          summary.innerHTML = uzt('<div class="ok-box" style="margin-top:12px;">Импортировано учителей: ')+addedTeachers+
            (skippedTeachers ? uzt(" (пропущено как уже существующие: ")+skippedTeachers+")" : "") +
            uzt('. Обнаружено и добавлено новых классов по колонке «Классы»: ')+addedClasses+
            uzt('. Предметы, часы и учебный план в выгрузке отсутствуют — задайте их на соответствующих вкладках.</div>');
        }
        render();
      };
      reader.readAsText(file, "UTF-8");
    };
  }

  var importInput = document.getElementById("import-json-input");
  if(importInput){
    importInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        try{
          var parsed = JSON.parse(evt.target.result);
          if(parsed && parsed.state){
            state = parsed.state; ensureParallels(state);
            idSeq = parsed.idSeq || idSeq;
            scheduleViewClassId = null;
            curriculumViewClassId = null;
            render();
          }
        }catch(err){ alert(uzt("Не удалось прочитать файл настроек.")); }
      };
      reader.readAsText(file);
    };
  }
}

function onClick(e){
  var t = e.target;
  var act = t.getAttribute("data-act");
  if(!act) return;
  var id = t.getAttribute("data-id");

  if(act==="class-add") addClass();
  else if(act==="class-del"){ state.classes = state.classes.filter(function(c){return c.id!==id;}); delete state.curriculum[id]; state.schedule=null; render(); }
  else if(act==="subj-add") addSubject();
  else if(act==="subj-del"){
    state.subjects = state.subjects.filter(function(s){return s.id!==id;});
    state.teachers.forEach(function(tt){ tt.subjects = tt.subjects.filter(function(sid){return sid!==id;}); });
    Object.keys(state.curriculum).forEach(function(cid){ delete state.curriculum[cid][id]; });
    state.schedule=null; render();
  }
  else if(act==="teach-add") addTeacher();
  else if(act==="teach-del"){ state.teachers = state.teachers.filter(function(tt){return tt.id!==id;}); state.schedule=null; render(); }
  else if(act==="room-add") addRoom();
  else if(act==="parallel-add"){
    var pg = parseInt(t.getAttribute("data-grade"),10);
    state.classes.push(newClassObj(pg, nextLetterFor(pg)));
    track("parallel_add_class", {grade: pg});
    state.schedule=null; render();
  }
  else if(act==="preset-create"){ buildPreset(state); track("preset_create"); state.schedule=null; render(); }
  else if(act==="room-del"){ state.rooms = state.rooms.filter(function(r){return r.id!==id;}); state.schedule=null; render(); }
  else if(act==="cur-select-class"){ curriculumViewClassId = id; render(); }
  else if(act==="cur-autofill"){ autofillCurriculum(id); render(); }
  else if(act==="cur-add-subject"){
    var classId4 = t.getAttribute("data-class");
    var sel = document.getElementById("cur-add-subj-select");
    if(sel && sel.value){
      if(!state.curriculum[classId4]) state.curriculum[classId4]={};
      var addedSubj = byId(state.subjects, sel.value);
      var clsForAdd = byId(state.classes, classId4);
      var officialMatch = addedSubj ? computeOfficialPlan(clsForAdd).filter(function(r){ return r.name===addedSubj.name; })[0] : null;
      state.curriculum[classId4][sel.value] = {
        hours: officialMatch ? officialMatch.hours : 0,
        teacherId: null,
        unofficial: officialMatch ? officialMatch.unofficial : false,
        blockSize: 1,
        syncWith: null
      };
      state.schedule=null;
    }
    render();
  }
  else if(act==="cur-remove-subject"){
    var classId5 = t.getAttribute("data-class");
    var subjId5 = t.getAttribute("data-subj");
    if(state.curriculum[classId5]) delete state.curriculum[classId5][subjId5];
    state.schedule=null; render();
  }
  else if(act==="cur-split-group"){
    var classIdSg = t.getAttribute("data-class");
    var subjIdSg = t.getAttribute("data-subj");
    var planSg = state.curriculum[classIdSg];
    var entrySg = planSg && planSg[subjIdSg];
    if(entrySg && !entrySg.syncWith){
      var baseName = subjectRawName(subjIdSg);
      var groupName = /\(группа \d+\)$/.test(baseName) ? baseName.replace(/\(группа \d+\)$/, "(группа 2)") : baseName+" (группа 2)";
      var newSubjId = findOrCreateSubject(groupName);
      var nsg = byId(state.subjects, newSubjId), bsg = byId(state.subjects, subjIdSg);
      if(nsg && !nsg.nameUz) nsg.nameUz = ((bsg && bsg.nameUz) || baseName).replace(/ \(2-guruh\)$/, "") + " (2-guruh)";
      if(!planSg[newSubjId]){
        planSg[newSubjId] = { hours: entrySg.hours, teacherId: null, unofficial: entrySg.unofficial, blockSize: entrySg.blockSize||1, syncWith: subjIdSg };
        entrySg.syncWith = newSubjId;
      }
      state.schedule=null;
    }
    render();
  }
  else if(act==="sched-select-class"){ scheduleViewClassId = id; render(); }
  else if(act==="goto-issue"){
    e.preventDefault();
    goToIssue(t.getAttribute("data-tab"), id || null);
    render();
    try{ document.getElementById("steps").scrollIntoView({ behavior: "smooth" }); }catch(x){}
  }
  else if(act==="cell-lock"){
    var lkC = t.getAttribute("data-class"), lkD = parseInt(t.getAttribute("data-day"),10), lkP = parseInt(t.getAttribute("data-period"),10);
    var lkCell = state.schedule.byClass[lkC][lkD][lkP];
    if(lkCell) lkCell.locked = true;
    render();
  }
  else if(act==="cell-unlock"){
    var ulC = t.getAttribute("data-class"), ulD = parseInt(t.getAttribute("data-day"),10), ulP = parseInt(t.getAttribute("data-period"),10);
    var ulCell = state.schedule.byClass[ulC][ulD][ulP];
    if(ulCell) ulCell.locked = false;
    render();
  }
  else if(act==="generate"){ generateSchedule(); track("schedule_generate", {classes: state.classes.length, unplaced: state.schedule ? state.schedule.unplacedCount : 0}); render(); }
  else if(act==="clear-schedule"){ state.schedule=null; render(); }
  else if(act==="export-xlsx") doExportXlsx();
  else if(act==="export-json") doExportJson();
  else if(act==="reset-all"){
    if(confirm(uzt("Удалить все классы, предметы, учителей и расписание без возможности восстановления?"))){
      state = defaultState(); track("reset_all");
      scheduleViewClassId=null; curriculumViewClassId=null; render();
    }
  }
}

function onChange(e){
  var t = e.target;
  var act = t.getAttribute("data-act");
  if(!act) return;
  var id = t.getAttribute("data-id");

  if(act==="class-name"){ byId(state.classes,id).name = t.value; saveState(); }
  else if(act==="class-students"){ byId(state.classes,id).studentCount = t.value ? Math.max(1, parseInt(t.value,10)) : null; state.schedule=null; saveState(); }
  else if(act==="subj-roomtype"){ byId(state.subjects,id).roomType = t.value.trim() || null; state.schedule=null; saveState(); }
  else if(act==="subj-heavy"){ byId(state.subjects,id).heavy = t.checked; saveState(); }
  else if(act==="room-name"){ byId(state.rooms,id).name = t.value; saveState(); }
  else if(act==="room-capacity"){ byId(state.rooms,id).capacity = Math.max(1, parseInt(t.value,10)||1); state.schedule=null; saveState(); }
  else if(act==="room-type"){ byId(state.rooms,id).type = t.value.trim() || null; state.schedule=null; saveState(); }
  else if(act==="class-shift"){ byId(state.classes,id).shiftOverride = t.value ? parseInt(t.value,10) : null; state.schedule=null; render(); }
  else if(act==="cur-variant"){
    var cvC = t.getAttribute("data-class"), cvS = t.getAttribute("data-subj"), cvN = t.value;
    var planCv = state.curriculum[cvC];
    if(planCv && planCv[cvS] && cvN && cvN !== cvS && !planCv[cvN]){
      var moved = planCv[cvS];
      delete planCv[cvS];
      planCv[cvN] = moved;
      if(moved.syncWith && planCv[moved.syncWith]) planCv[moved.syncWith].syncWith = cvN;
      state.schedule = null;
    }
    render();
  }
  else if(act==="parallel-periods"){
    ensureParallels(state);
    var ppg = parseInt(t.getAttribute("data-grade"),10);
    state.config.parallels[ppg].periods = parseInt(t.value,10) || 6;
    state.schedule=null; render();
  }
  else if(act==="class-periods"){ byId(state.classes,id).periodsOverride = t.value ? parseInt(t.value,10) : null; state.schedule=null; render(); }
  else if(act==="parallel-shift"){
    ensureParallels(state);

  else if(act==="class-homeschool"){ var cHo=byId(state.classes,id); cHo.isHomeschool = t.checked; state.schedule=null; render(); }
  else if(act==="class-grade"){ var cGrade=byId(state.classes,id); cGrade.grade = t.value ? parseInt(t.value,10) : null; cGrade.officialPlanApplied=false; render(); }
  else if(act==="class-lang"){ var cLang=byId(state.classes,id); cLang.instructionLang = t.value; cLang.officialPlanApplied=false; render(); }
  else if(act==="class-jasorat"){ var cJas=byId(state.classes,id); cJas.jasorat = t.checked; cJas.officialPlanApplied=false; render(); }
  else if(act==="class-direction"){
    // одно поле на два источника: "t:<ключ>" — направление приказа №183, "v:<ключ>" — вариативный план №227
    var cDir=byId(state.classes,id), dv=t.value;
    cDir.variativ = dv.indexOf("v:")===0 ? dv.slice(2) : null;
    cDir.track = dv.indexOf("t:")===0 ? dv.slice(2) : "none";
    cDir.officialPlanApplied=false; render();
  }
  else if(act==="class-qsample"){ var cQs=byId(state.classes,id); cQs.qardoshSample = parseInt(t.value,10)===2 ? 2 : 1; cQs.officialPlanApplied=false; render(); }
  else if(act==="class-secondlang"){ var cSl=byId(state.classes,id); cSl.secondForeignLang = t.value; cSl.officialPlanApplied=false; saveState(); }
  else if(act==="cur-firstforeign-select"){ var cFf=byId(state.classes,id); cFf.firstForeignLang = t.value; cFf.officialPlanApplied=false; saveState(); }
  else if(act==="cur-technology-select"){ var cTm=byId(state.classes,id); cTm.technologyMode = t.value; cTm.officialPlanApplied=false; saveState(); }
  else if(act==="subj-name"){ var sN = byId(state.subjects,id); if(uiLang === "uz") sN.nameUz = t.value; else sN.name = t.value; saveState(); }
  else if(act==="teach-name"){ byId(state.teachers,id).name = t.value; saveState(); }
  else if(act==="teach-max"){ byId(state.teachers,id).maxPerDay = Math.max(1, parseInt(t.value,10)||1); saveState(); }
  else if(act==="teach-subj"){
    var teacher = byId(state.teachers,id);
    var subjId = t.getAttribute("data-subj");
    if(t.checked){ if(teacher.subjects.indexOf(subjId)===-1) teacher.subjects.push(subjId); }
    else{ teacher.subjects = teacher.subjects.filter(function(s){return s!==subjId;}); }
    state.schedule=null; render();
  }
  else if(act==="teach-off"){
    var teacher2 = byId(state.teachers,id);
    var day = parseInt(t.getAttribute("data-day"),10);
    teacher2.daysOff[day] = t.checked;
    state.schedule=null; saveState();
  }
  else if(act==="cur-hours"){
    var classId = t.getAttribute("data-class");
    var subjId2 = t.getAttribute("data-subj");
    if(!state.curriculum[classId]) state.curriculum[classId]={};
    if(!state.curriculum[classId][subjId2]) state.curriculum[classId][subjId2]={hours:0,teacherId:null,blockSize:1,syncWith:null};
    state.curriculum[classId][subjId2].hours = Math.max(0, Math.round((parseFloat(t.value)||0)*2)/2);
    state.schedule=null; render();
  }
  else if(act==="cur-teacher"){
    var classId2 = t.getAttribute("data-class");
    var subjId3 = t.getAttribute("data-subj");
    if(!state.curriculum[classId2]) state.curriculum[classId2]={};
    if(!state.curriculum[classId2][subjId3]) state.curriculum[classId2][subjId3]={hours:0,teacherId:null,blockSize:1,syncWith:null};
    state.curriculum[classId2][subjId3].teacherId = t.value || null;
    state.schedule=null; render();
  }
  else if(act==="cur-blocksize"){
    var classIdBs = t.getAttribute("data-class");
    var subjIdBs = t.getAttribute("data-subj");
    state.curriculum[classIdBs][subjIdBs].blockSize = parseInt(t.value,10);
    state.schedule=null; render();
  }
  else if(act==="cur-syncwith"){
    var classIdSw = t.getAttribute("data-class");
    var subjIdSw = t.getAttribute("data-subj");
    var planSw = state.curriculum[classIdSw];
    var entrySw = planSw[subjIdSw];
    var oldPartner = entrySw.syncWith;
    if(oldPartner && planSw[oldPartner]) planSw[oldPartner].syncWith = null;
    var newPartner = t.value || null;
    if(newPartner && planSw[newPartner]){
      var newPartnerOld = planSw[newPartner].syncWith;
      if(newPartnerOld && planSw[newPartnerOld]) planSw[newPartnerOld].syncWith = null;
      planSw[newPartner].syncWith = subjIdSw;
    }
    entrySw.syncWith = newPartner;
    state.schedule=null; render();
  }
  else if(act==="cell-change"){
    var cId = t.getAttribute("data-class");
    var d = parseInt(t.getAttribute("data-day"),10);
    var p = parseInt(t.getAttribute("data-period"),10);
    var val = t.value;
    if(!val){ state.schedule.byClass[cId][d][p] = null; }
    else{
      var unit = computeUnits(cId).filter(function(u){ return u.key===val; })[0];
      if(unit){
        state.schedule.byClass[cId][d][p] = {
          locked: false,
          lessons: unit.members.map(function(m){ return { subjectId: m.subjectId, teacherId: m.teacherId, roomId: null }; })
        };
      }
    }
    render();
  }
}

function offerDownload(filename, data){
  // вне claude.ai глобальной переменной claude нет вообще (не undefined-значение,
  // а неопределённая переменная) — обращение к ней без проверки роняет код синхронно,
  // до того как сработает .catch(); поэтому проверка typeof обязательна
  if(typeof claude === "undefined" || !claude || !claude.use){ fallbackDownload(filename, data); return; }
  claude.use("downloads").then(function(downloads){
    if(!downloads){ fallbackDownload(filename, data); return; }
    downloads.save({ filename: filename, data: data }).catch(function(err){
      if(err && err.code === "unavailable"){ fallbackDownload(filename, data); }
    });
  }).catch(function(){ fallbackDownload(filename, data); });
}
function fallbackDownload(filename, data){
  try{
    var blob = (data instanceof ArrayBuffer) ? new Blob([data]) : new Blob([data], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ alert(uzt("Скачивание недоступно в этом окне просмотра.")); }
}

/* ================= SUBJECT VARIANTS ================= */
var VARIANT_SUFFIXES = [" по выбору", " вариатив", " Экономика", " Жасорат"];
function baseSubjectName(name){
  name = String(name);
  for(var i=0; i<VARIANT_SUFFIXES.length; i++){
    var s = VARIANT_SUFFIXES[i];
    if(name.length > s.length && name.slice(-s.length) === s) return name.slice(0, -s.length);
  }
  return name;
}
function subjectVariants(subjId){
  var base = baseSubjectName(subjectRawName(subjId));
  var names = [base].concat(VARIANT_SUFFIXES.map(function(s){ return base+s; }));
  var out = [];
  names.forEach(function(n){ var s = state.subjects.filter(function(x){ return x.name===n; })[0]; if(s) out.push(s); });
  return out;
}
function subjectCellHtml(classId, subjId){
  var vars = subjectVariants(subjId);
  if(vars.length < 2) return escHtml(subjectName(subjId));
  var h = '<select class="variant-select" data-act="cur-variant" data-class="'+classId+'" data-subj="'+subjId+uzt('" title="Вариант предмета">');
  vars.forEach(function(v){ h += '<option value="'+v.id+'"'+(v.id===subjId?" selected":"")+'>'+escHtml(subjDisplay(v))+'</option>'; });
  return h+'</select>';
}
function teacherCanTeach(tch, subjId){
  if(tch.subjects.indexOf(subjId) !== -1) return true;
  var base = baseSubjectName(subjectRawName(subjId));
  return tch.subjects.some(function(sid){ return baseSubjectName(subjectRawName(sid)) === base; });
}

function syncGradeCount(g, n){
  var list = state.classes.filter(function(c){ return c.grade===g && !c.isHomeschool; })
    .sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
  while(list.length < n){ var c = newClassObj(g, nextLetterFor(g)); state.classes.push(c); list.push(c); }
  if(list.length > n){
    var drop = {};
    list.slice(n).forEach(function(c){ drop[c.id] = true; delete state.curriculum[c.id]; });
    state.classes = state.classes.filter(function(c){ return !drop[c.id]; });
  }
}

    var exists = state.teachers.some(function(x){ return x.name.trim().toLowerCase() === r.name.trim().toLowerCase(); });
    if(exists) return;
    state.teachers.push({ id: uid("teach"), name: r.name, subjects: [], maxPerDay: 5, daysOff: new Array(MAX_DAYS).fill(false), homeroomNote: r.classesRaw || "" });
    n++;
  });
  return n;
}
function numOpts(from, to){ var a = []; for(var i=from; i<=to; i++) a.push([String(i), String(i)]); return a; }
/* Составление расписания из бота: те же проверки, что у кнопки в мастере.
   При ошибке бот не идёт дальше, а открывает шаг мастера, где её исправить. */
function issueTextsBothLangs(kind){
  return inBothLangs(function(){ return generationIssues()[kind].map(function(x){ return "• "+x.text; }).join("\n"); });
}
function botIssueOptions(list){
  var seen = {}, out = [];
  list.forEach(function(x){
    var key = x.tab + (x.classId ? ":"+x.classId : "");
    if(seen[key]) return;
    seen[key] = true;
    var label = t("nav_"+x.tab) + (x.classId ? " — "+className(x.classId) : "");
    out.push(["go:"+key, bt("go", {tab: label})]);
  });
  return out;
}
function botRunGenerate(){
  var issues = generationIssues();
  if(issues.errors.length){
    bot.genBlocked = true;
    bot.log.push({ who:"bot", key:"gen_blocked", vars:{ list: issueTextsBothLangs("errors") } });
    goToIssue(issues.errors[0].tab, issues.errors[0].classId);
    return false;
  }
  bot.genBlocked = false;
  generateSchedule();
  track("schedule_generate", {classes: state.classes.length, unplaced: state.schedule.unplacedCount, via: "bot"});
  bot.log.push({ who:"bot", key:"gen_done", vars:{u: state.schedule.unplacedCount} });
  if(issues.warnings.length) bot.log.push({ who:"bot", key:"gen_warn", vars:{ list: issueTextsBothLangs("warnings") } });
  activeTab = "schedule";
  return true;
}
function botSteps(){
  var s = [];
  s.push({ key:"intro", ask: function(){ return bt("intro")+"\n"+bt("intro_warn"); }, options: function(){ return [["start", bt("start")]]; }, apply: function(){} });
  s.push({ key:"type", ask: function(){ return bt("q_type"); }, options: function(){ return [["criterial", bt("a_crit")], ["classical", bt("a_class")]]; },
           apply: function(v){ state.config.schoolType = v; } });
  for(var g=1; g<=11; g++){
    (function(g){
      s.push({ key:"count"+g, ask: function(){ return bt("q_count", {g:g}); }, options: function(){ return numOpts(0, 6); },
               apply: function(v){ syncGradeCount(g, parseInt(v,10)); } });
    })(g);
  }
  s.push({ key:"days_j", ask: function(){ return bt("q_days_j"); }, options: function(){ return numOpts(5,6); }, apply: function(v){ setParallels(1,4,"days",parseInt(v,10)); } });
  s.push({ key:"days_s", ask: function(){ return bt("q_days_s"); }, options: function(){ return numOpts(5,6); }, apply: function(v){ setParallels(5,11,"days",parseInt(v,10)); } });
  s.push({ key:"shift_j", ask: function(){ return bt("q_shift_j"); }, options: function(){ return numOpts(1,3); }, apply: function(v){ setParallels(1,4,"shift",parseInt(v,10)); } });
  s.push({ key:"shift_s", ask: function(){ return bt("q_shift_s"); }, options: function(){ return numOpts(1,3); }, apply: function(v){ setParallels(5,11,"shift",parseInt(v,10)); } });
  s.push({ key:"per_j", ask: function(){ return bt("q_per_j"); }, options: function(){ return numOpts(4,7); }, apply: function(v){ setParallels(1,4,"periods",parseInt(v,10)); } });
  s.push({ key:"per_s", ask: function(){ return bt("q_per_s"); }, options: function(){ return numOpts(5,8); }, apply: function(v){ setParallels(5,11,"periods",parseInt(v,10)); } });
  s.push({ key:"staff", file: true, ask: function(){ return bt("q_staff"); }, options: function(){ return [["skip", bt("a_skip")]]; }, apply: function(){} });
  s.push({ key:"plan",
    ask: function(){ return bt("q_plan"); },
    options: function(){ return [["yes", bt("a_yes")], ["no", bt("a_no")]]; },
    apply: function(v){
      if(v !== "yes") return;
      var n = 0;
      state.classes.forEach(function(c){ if(c.grade>=5 && !c.isHomeschool){ c.officialPlanApplied = false; autofillCurriculum(c.id); n++; } });
      bot.log.push({ who:"bot", key:"plan_done", vars:{n:n} });
    } });
  s.push({ key:"gen", ask: function(){ return bt("q_gen"); },
    options: function(){
      // после неудачной попытки: «Продолжить» (проверить ещё раз) + переходы к местам ошибок
      if(!bot.genBlocked) return [["gen", bt("a_gen")], ["later", bt("a_later")]];
      return [["gen", bt("a_continue")]].concat(botIssueOptions(generationIssues().errors), [["later", bt("a_later")]]);
    },
    apply: function(v){
      if(v !== "gen") return "skip"; // «Позже» — сразу к финалу, минуя разбор результата
      return botRunGenerate() ? undefined : false;
    } });
  s.push({ key:"review", ask: function(){ return bt("q_review"); },
    options: function(){
      var is = generationIssues();
      return [["regen", bt("a_regen")]].concat(botIssueOptions(is.errors.concat(is.warnings)),
        [["go:schedule", bt("a_open_schedule")], ["finish", bt("a_finish")]]);
    },
    apply: function(v){
      if(v === "regen"){ botRunGenerate(); return false; } // остаёмся на шаге разбора
    } });
  s.push({ key:"done", ask: function(){ return bt("done"); }, options: function(){ return [["restart", bt("restart")], ["collapse", bt("a_collapse")]]; }, apply: function(){} });
  return s;
}
function botGoTo(i){
  var steps = botSteps();
  bot.idx = i;
  if(steps[i]) bot.log.push({ who:"bot", step: i });
}
function botRestart(){ bot.log = []; bot.open = true; bot.genBlocked = false; botGoTo(0); track("bot_start"); }
function botAnswer(value){
  var steps = botSteps(), st = steps[bot.idx];
  if(!st) return;
  if(st.key === "done"){
    if(value === "restart"){ botRestart(); }
    else { bot.open = false; try{ localStorage.setItem("tt_bot_collapsed","1"); }catch(e){} }
    render();
    return;
  }
  // «Открыть: …» — переход в мастер без ответа на вопрос: бот остаётся на том же шаге
  if(value.indexOf("go:") === 0){
    var gp = value.split(":");
    goToIssue(gp[1], gp[2] || null);
    track("bot_goto", {tab: gp[1], step: st.key});
    render();
    try{ document.getElementById("steps").scrollIntoView({ behavior: "smooth" }); }catch(x){}
    return;
  }
  // подпись ответа запоминаем на обоих языках: подписи кнопок шага могут меняться (Составить → Продолжить)
  var label = inBothLangs(function(){
    var o = st.options().filter(function(x){ return x[0] === value; })[0];
    return o ? o[1] : String(value);
  });
  bot.log.push({ who:"me", step: bot.idx, value: value, label: label });
  var res;
  try{ res = st.apply(value); }catch(e){ bot.log.push({ who:"bot", key:"err", vars:{ m: e.message } }); }
  track("bot_step", {step: st.key});
  // ответы про классы, дни, смены, уроки и учебный план делают старое расписание неактуальным
  if(["intro","staff","gen","review"].indexOf(st.key) < 0) state.schedule = null;
  // apply: false — остаться на шаге, "skip" — перескочить следующий шаг
  if(res !== false) botGoTo(bot.idx + (res === "skip" ? 2 : 1));
  render();
}
function inBothLangs(fn){
  var saved = uiLang, out = {};
  ["ru","uz"].forEach(function(l){ uiLang = l; out[l] = fn(); });
  uiLang = saved;
  return out;
}
/* Текст реплики собирается при каждой отрисовке на текущем языке интерфейса,
   поэтому после переключения RU/UZ вся история бота тоже переводится. */
function botMsgText(m, steps){
  if(m.key) return bt(m.key, m.vars);
  if(m.step !== undefined){
    var s = (steps || botSteps())[m.step];
    if(!s) return m.text || "";
    if(m.who === "me"){
      if(m.label) return m.label[uiLang] || m.label.ru;
      var o = s.options().filter(function(x){ return x[0] === m.value; })[0];
      return o ? o[1] : (m.text || String(m.value));
    }
    return s.ask();
  }
  return m.text || "";
}
function renderBot(){
  var el = document.getElementById("bot");
  if(!el) return;
  var steps = botSteps();
  if(bot.idx < 0) botGoTo(0);
  var h = '<div class="bot"><div class="bot-head"><div class="bot-title">🤖 '+escHtml(bt("title"))+' <span>'+escHtml(bt("sub"))+'</span></div>';
  h += '<div class="bot-head-actions">';
  if(bot.open) h += '<span class="bot-progress">'+Math.min(bot.idx+1, steps.length)+' / '+steps.length+'</span>';
  h += '<button class="btn btn-sm" data-bot-act="restart">'+escHtml(bt("restart"))+'</button>';
  h += '<button class="btn btn-sm" data-bot-act="toggle">'+escHtml(bot.open ? bt("collapse") : bt("expand"))+'</button></div></div>';
  if(bot.open){
    h += '<div class="bot-log" id="botLog">';
    bot.log.forEach(function(m){ h += '<div class="bubble '+(m.who==="me"?"me":"bot")+'">'+escHtml(botMsgText(m, steps))+'</div>'; });
    h += '</div>';
    var cur = steps[bot.idx];
    if(cur){
      h += '<div class="bot-actions">';
      cur.options().forEach(function(o, i){ h += '<button class="btn'+(i===0 && !cur.file ? ' btn-primary' : '')+'" data-bot-ans="'+escAttr(o[0])+'">'+escHtml(o[1])+'</button>'; });
      if(cur.file) h += '<label class="btn btn-primary bot-file">📎 '+escHtml(bt("upload"))+'<input type="file" data-bot-file="1" accept=".xls,.html,text/html" hidden></label>';
      h += '</div>';
    }
  }
  h += '</div>';
  el.innerHTML = h;
  var log = document.getElementById("botLog");
  if(log) log.scrollTop = log.scrollHeight;
}
function onBotClick(e){
  var tg = e.target && e.target.closest ? e.target.closest("[data-bot-ans],[data-bot-act]") : null;
  if(!tg) return;
  var ans = tg.getAttribute("data-bot-ans"), act = tg.getAttribute("data-bot-act");
  if(ans !== null){ botAnswer(ans); return; }
  if(act === "toggle"){
    bot.open = !bot.open;
    try{ localStorage.setItem("tt_bot_collapsed", bot.open ? "0" : "1"); }catch(x){}
    renderBot();
  } else if(act === "restart"){ botRestart(); render(); }
}
function onBotChange(e){
  var tg = e.target;
  if(!tg || !tg.getAttribute || !tg.getAttribute("data-bot-file")) return;
  var f = tg.files && tg.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var rows = null;
    try{ rows = parseStaffExport(ev.target.result); }catch(x){ rows = null; }
    bot.log.push({ who:"me", text: "📎 "+f.name });
    if(!rows || !rows.length){ bot.log.push({ who:"bot", key:"staff_bad" }); renderBot(); return; }
    bot.log.push({ who:"bot", key:"staff_ok", vars:{n: botAddTeachers(rows)} });
    botGoTo(bot.idx + 1);
    render();
  };
  reader.readAsText(f, "UTF-8");
}
(function(){
  var be = document.getElementById("bot");
  if(be){ be.addEventListener("click", onBotClick); be.addEventListener("change", onBotChange); }
})();

(function normalizeUz(){
  STRINGS.uz.btn_export_excel = "Excel faylini yuklab olish (.xlsx)";
  Object.keys(STRINGS.uz).forEach(function(k){ if(k !== "lang_toggle") STRINGS.uz[k] = uzNorm(STRINGS.uz[k]); });
  Object.keys(BOT_T.uz).forEach(function(k){ BOT_T.uz[k] = uzNorm(BOT_T.uz[k]); });
})();

/* ---------------- init ---------------- */
render();
initCloudSync();

})();
</script>
