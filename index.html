    else if(noTeacher) h += botCheckRow("warn", uzt("Учителя назначены не всем"), nWord(noTeacher, ["предмет без учителя","предмета без учителя","предметов без учителя"], "ta fan o'qituvchisiz") + uzt(" — для них занятость не проверяется"), goLoad);
    else h += botCheckRow("ok", uzt("Учителя назначены"), nWord(state.teachers.length, ["учитель","учителя","учителей"], "ta o'qituvchi"));
    if(!state.rooms.length) h += botCheckRow("info", uzt("Кабинеты не заведены"), uzt("Составлю без кабинетов; добавить их можно в «Справочниках»."));
    is.errors.forEach(function(x){
      h += botCheckRow("warn", uzt("Ошибка"), issueText(x), '<button class="link-btn" data-bot-act="issue" data-tab="'+x.tab+'" data-id="'+(x.classId||"")+'" data-code="'+x.code+'">'+escHtml(uzt("Исправить →"))+'</button>');
    });
    h += '</div>';
    // правила школы — до составления, чтобы генератор их учёл (0.11, А2)
    h += '<div class="bot-rules"><h3 class="emk-h3">'+escHtml(uzt("Правила школы"))+'</h3>'+ruleQuestionsHtml("data-bot-act")+
      (ruleAnswer("pd") === true ? '<p class="muted" style="margin:6px 0 0;">'+escHtml(uzt("Дни профразвития — по приказу №246; поменять их и поставить учителю свой день можно на шаге «Расписание» → «Правила школы»."))+'</p>' : '')+'</div>';
    S.left = back;
    S.right = '<button class="btn btn-primary" data-bot-act="gen"'+(is.errors.length?" disabled":"")+'>'+escHtml(uzt("Составить расписание"))+'</button>';
  } else {
    var sc = state.schedule;
    S.q = sc ? uzt("Расписание составлено") : uzt("Расписание ещё не составлено");
    if(sc){
      var nt = 0;
      state.classes.forEach(function(c){ var pl = state.curriculum[c.id] || {}; Object.keys(pl).forEach(function(k){ if(pl[k].hours > 0 && !pl[k].teacherId) nt++; }); });
      var tiles = [[sc.unplacedCount || 0, uzt("уроков не размещено")], [countWindows(sc.byClass), uzt("окон у классов")], [computeConflicts().size, uzt("конфликтов учителей")], [nt, uzt("предметов без учителя")]];
      h += '<div class="bot-tiles">'+tiles.map(function(x){ return '<div class="bot-tile '+(x[0] ? "warn" : "ok")+'"><strong>'+x[0]+'</strong><span>'+escHtml(x[1])+'</span></div>'; }).join("")+'</div>';
      h += '<p class="muted" style="margin:0;">'+escHtml(nt ? uzt("Дальше: назначьте учителей на шаге «Нагрузка» и нажмите «Перестроить» — закреплённые вами уроки останутся на месте.") : uzt("Проверьте сетку и скачайте Excel на шаге «Выгрузка»."))+'</p>';
    }
    S.left = '<button class="btn btn-ghost" data-bot-act="gen">'+escHtml(uzt("Составить заново"))+'</button>';
    S.right = (nt ? '<button class="btn" data-bot-act="goto" data-v="load">'+escHtml(uzt("Назначить учителей"))+'</button>' : '') + '<button class="btn btn-primary" data-bot-act="goto" data-v="schedule">'+escHtml(uzt("Открыть расписание"))+'</button>';
  }
  S.body = h;
  return S;
}
/* Фокус на старте (0.11, А1): пока не выбран путь, виден только бот, остальное размыто — чтобы прочитали вопрос.
   «Осмотреться без подсказки» снимает фокус насовсем; «Начать заново» в боте возвращает его. */
var focusDismissed = false;
try{ focusDismissed = localStorage.getItem("tt_focus_off") === "1"; }catch(e){}
function focusStartOn(){ return bot.open && !bot.path && !focusDismissed; }
function renderBot(){
  var el = document.getElementById("bot");
  if(!el) return;
  availCache = null;
  if(!bot.draft) botInitDraft();
  var fOn = focusStartOn();
  try{
    document.body.classList.toggle("focus-start", fOn);
    ["steps", "main"].forEach(function(id){ var n = document.getElementById(id); if(n){ if(fOn) n.setAttribute("aria-hidden", "true"); else n.removeAttribute("aria-hidden"); } });
  }catch(e){}
  if(fOn && !bot.focusTracked){ bot.focusTracked = true; track("focus_start", { action: "shown" }); }
  if(bot.open && !bot.resume && !bot.startTracked){ bot.startTracked = true; track("bot_start", { first: true }); }
  var h, nSteps = botSteps().length;
  if(!bot.open || bot.resume){
    var txt = !bot.path ? uzt("Расписание уже есть в eMaktab? Загрузите его — или составьте с нуля.")
      : bot.resume ? uzt("Вы остановились на шаге ")+(bot.step+1)+uzt(" из ")+nSteps+" — «"+botStepLabel(bot.step)+uzt("». Продолжим с того же места?")
      : bot.step >= botDoneStep() ? (bot.path === "import" ? uzt("Расписание загружено из eMaktab. Загрузить заново можно в любой момент.") : uzt("Первое расписание составлено. Настройку можно пройти заново."))
      : uzt("Шаг ")+(bot.step+1)+uzt(" из ")+nSteps+" — «"+botStepLabel(bot.step)+"»";
    h = '<section class="bot bot-slim" aria-label="'+escAttr(uzt("Быстрая настройка"))+'"><strong>'+escHtml(uzt("Быстрая настройка"))+'</strong><span class="bot-slim-text">'+escHtml(txt)+'</span>';
    h += bot.resume ? '<button class="btn btn-sm" data-bot-act="restart">'+escHtml(uzt("Начать заново"))+'</button><button class="btn btn-sm btn-primary" data-bot-act="open">'+escHtml(uzt("Продолжить"))+'</button>'
      : '<button class="btn btn-sm btn-primary" data-bot-act="open">'+escHtml(!bot.path || bot.step >= botDoneStep() ? uzt("Открыть") : uzt("Продолжить"))+'</button>';
    el.innerHTML = h + '</section>';
    return;
  }
  var sub = !bot.path ? uzt("Начнём с главного вопроса.") : bot.path === "import" ? uzt("Загрузка из eMaktab — и проверка покажет конфликты и окна.") : uzt("5 шагов — и первое расписание готово. Всё можно поправить потом в мастере.");
  h = '<section class="bot" aria-label="'+escAttr(uzt("Быстрая настройка"))+'"><div class="bot-head"><div class="bot-title">'+escHtml(uzt("Быстрая настройка"))+' <span>'+escHtml(sub)+'</span></div>';
  h += '<div class="bot-head-actions"><button class="btn btn-sm" data-bot-act="restart">'+escHtml(uzt("Начать заново"))+'</button><button class="btn btn-sm" data-bot-act="toggle">'+escHtml(uzt("Свернуть"))+'</button></div></div>';
  if(!bot.path){
    h += '<div class="bot-card"><div><h2 class="bot-q">'+escHtml(uzt("Расписание уже есть в eMaktab?"))+'</h2><p class="bot-hint">'+escHtml(uzt("Если да — загрузите его: классы, учителя и нагрузка заполнятся сами, а проверка сразу покажет конфликты и окна. Если нет — составим с нуля за 5 шагов."))+'</p></div>';
    h += '<div class="bot-path"><button class="btn btn-primary" data-bot-act="path" data-v="import">'+escHtml(uzt("Да, загружу из eMaktab"))+'</button><button class="btn" data-bot-act="path" data-v="scratch">'+escHtml(uzt("Нет, начну с нуля"))+'</button></div>';
    if(focusStartOn()) h += '<div class="focus-hint"><span>'+escHtml(uzt("Начните отсюда — остальной конструктор откроется после ответа."))+'</span><button type="button" class="link-btn" data-bot-act="focus-off">'+escHtml(uzt("Осмотреться без подсказки"))+'</button></div>';
    h += '</div></section>';
    el.innerHTML = h;
    return;
  }
  var S = botScreen();
  h += '<ol class="bot-steps">';
  botSteps().forEach(function(s, i){
    var cls = i < bot.step ? "done" : (i === bot.step ? "cur" : "");
    h += '<li class="'+cls+'"'+(i === bot.step ? ' aria-current="step"' : '')+'><span class="bar"></span><span class="lbl">'+(i < bot.step ? ICON_STEP_OK : "")+(i+1)+'. '+escHtml(uzt(s[1]))+'</span></li>';
  });
  h += '</ol><div class="bot-card"><div><h2 class="bot-q">'+escHtml(S.q)+'</h2>'+(S.hint ? '<p class="bot-hint">'+escHtml(S.hint)+'</p>' : '')+'</div>'+S.body;
  h += '<div class="bot-foot"><div class="row">'+S.left+'</div><div class="row">'+S.right+'</div></div></div></section>';
  el.innerHTML = h;
}
function onBotClick(e){
  var tg = e.target && e.target.closest ? e.target.closest("[data-bot-act]") : null;
  if(!tg || tg.tagName === "SELECT" || tg.tagName === "INPUT") return;
  var act = tg.getAttribute("data-bot-act"), v = tg.getAttribute("data-v"), d = bot.draft;
  if(act === "toggle"){ bot.open = !bot.open; bot.resume = false; botSave(); renderBot(); }
  else if(act === "open"){ bot.open = true; bot.resume = false; botSave(); renderBot(); }
  else if(act === "restart"){ botRestart(); render(); }
  else if(act === "type"){ d.type = v; renderBot(); }
  else if(act === "cnt"){ var g = parseInt(tg.getAttribute("data-g"),10); d.counts[g] = Math.max(0, Math.min(15, d.counts[g] + parseInt(v,10))); renderBot(); }
  else if(act === "mode"){ d.mode[tg.getAttribute("data-r")][tg.getAttribute("data-f")] = parseInt(v,10); renderBot(); }
  else if(act === "next") botNext();
  else if(act === "back"){ if(bot.step === 0) bot.path = null; else bot.step = Math.max(0, bot.step - 1); botSave(); renderBot(); }
  else if(act === "path"){ bot.path = v; bot.step = 0; botSave(); track("bot_step", { step: "path_" + v }); renderBot(); }
  else if(act === "reload-emk"){ bot.step = 0; botSave(); renderBot(); }
  else if(act === "rule-q"){ setRuleAnswer(tg.getAttribute("data-q"), v === "1"); render(); }
  else if(act === "focus-off"){ focusDismissed = true; try{ localStorage.setItem("tt_focus_off", "1"); }catch(x){} track("focus_start", { action: "dismiss" }); render(); }
  else if(act === "gen") botGenerate();
  else if(act === "goto" || act === "issue"){
    var tab = act === "issue" ? tg.getAttribute("data-tab") : v;
    track("bot_goto", { tab: tab, step: BOT_STEPS[Math.min(bot.step, 4)][0] });
    if(act === "issue") goToIssue(tab, tg.getAttribute("data-id") || null, "bot");
    else { if(tab === "load") loadMode = "parallel"; setTab(tab, "bot"); }
    render();
    try{ document.getElementById("steps").scrollIntoView({ behavior: "smooth" }); }catch(x){}
  }
}
function onBotChange(e){
  var tg = e.target;
  if(!tg || !tg.getAttribute) return;
  var act = tg.getAttribute("data-bot-act");
  if(act === "lang"){ bot.draft.lang = tg.value; return; }
  if(act === "mode-per"){ bot.draft.mode[tg.getAttribute("data-r")].per = parseInt(tg.value,10); return; }
  if(act === "mode-start"){ bot.draft.mode[tg.getAttribute("data-r")].start = parseInt(tg.value,10) || 1; return; }
  if(!tg.getAttribute("data-bot-file")) return;
  var f = tg.files && tg.files[0];
  if(!f) return;
  readStaffFile(f, "bot", function(ok){ bot.staffError = !ok; renderBot(); });
}
(function(){
  var be = document.getElementById("bot");
  if(be){ be.addEventListener("click", onBotClick); be.addEventListener("change", onBotChange); }
})();

(function normalizeUz(){
  STRINGS.uz.btn_export_excel = "Excel faylini yuklab olish (.xlsx)";
  Object.keys(STRINGS.uz).forEach(function(k){ if(k !== "lang_toggle") STRINGS.uz[k] = uzNorm(STRINGS.uz[k]); });
})();

/* ---------------- init ---------------- */
// необработанные ошибки — в аналитику без текста сообщения (в нём могут быть данные школы)
window.addEventListener("error", function(ev){ track("js_error", { kind: "error", line: ev && ev.lineno || 0 }); });
window.addEventListener("unhandledrejection", function(){ track("js_error", { kind: "promise" }); });
(function(){ var sb = document.getElementById("storageBar"); if(sb) sb.addEventListener("click", onStorageBarClick); })();
initTabGuard();
track("app_open", { first_visit: analyticsCtx.first_visit, storage_ok: !storage.error, has_schedule: !!state.schedule, classes: state.classes.length });
render();
renderStorageBar();
initCloudSync();

})();
</script>
