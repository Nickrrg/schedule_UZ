/* Resolves the official Sxema_KTP grid for one class's parameters into a flat
   list of {name, hours, unofficial}. Shared by the bulk autofill button and
   by the single manual "add subject" control, so both agree on the numbers. */
function computeOfficialPlan(cls){
  var result = [];
  var src = classPlanSource(cls);
  if(src.kind === "227" || src.kind === "183" || src.kind === "133") return orderPlanRows(cls, src);
  if(src.kind !== "base") return result;

  // базовая сетка КТП; профили 10–11 теперь берутся из таблиц приказа №183 (выше)
  var g = String(cls.grade);
  var trackKey = null;

  KTP_GRID.forEach(function(row){
    if(row.langGroup){
      var matches =
        (row.langGroup==="uz_medium" && cls.instructionLang==="uz") ||
        (row.langGroup==="state_ru_qr" && (cls.instructionLang==="ru" || cls.instructionLang==="qr")) ||
        (row.langGroup==="ru_medium" && cls.instructionLang==="ru") ||
        (row.langGroup==="qr_medium" && cls.instructionLang==="qr");
      if(!matches) return;
    }
    if(row.choiceGroup==="first_foreign" && row.choiceValue !== cls.firstForeignLang) return;
    if(row.choiceGroup==="second_foreign" && row.choiceValue !== cls.secondForeignLang) return;
    if(row.techVariant){
      var mode = cls.technologyMode || "split";
      var keep = (mode==="split" && (row.techVariant==="boys" || row.techVariant==="girls")) ||
                 (mode==="unified" && row.techVariant==="unified") ||
                 (mode==="agro" && row.techVariant==="agro");
      if(!keep) return;
    }

    var hours = null;
    if(trackKey && row.tracks[trackKey] && row.tracks[trackKey][g] !== undefined){
      hours = row.tracks[trackKey][g];
    } else if(row.base[g] !== undefined){
      hours = row.base[g];
    }
    if(hours === null) return;

    var subjectDisplayName = row.subject;
    var unofficial = false;
    var baseHours = row.base[g];
    if(cls.jasorat && (cls.grade===5 || cls.grade===6) && JASORAT_MAP[subjectDisplayName]){
      subjectDisplayName = JASORAT_MAP[subjectDisplayName];
      unofficial = true;
    } else if(TRACK_SUBJECT_VARIANTS[cls.track] && TRACK_SUBJECT_VARIANTS[cls.track][subjectDisplayName] &&
              baseHours !== undefined && hours !== baseHours){
      subjectDisplayName = TRACK_SUBJECT_VARIANTS[cls.track][subjectDisplayName];
    }
    result.push({ name: subjectDisplayName, hours: hours, unofficial: unofficial });
  });
  return result;
}

function autofillCurriculum(classId, opts){
  var cls = byId(state.classes, classId);
  var officialRows = computeOfficialPlan(cls);
  if(!officialRows.length) return;
  track("autofill_plan", { grade: cls.grade, source: classPlanSource(cls).kind });

  var oldPlan = state.curriculum[classId] || {};
  var newPlan = {};
  officialRows.forEach(function(row){
    var subjId = findOrCreateSubject(row.name);
    var prevEntry = oldPlan[subjId];
    newPlan[subjId] = {
      hours: row.hours,
      teacherId: prevEntry ? prevEntry.teacherId : null,
      unofficial: row.unofficial,
      blockSize: prevEntry ? (prevEntry.blockSize||1) : 1,
      syncWith: null
    };
  });

  if((cls.technologyMode||"split")==="split"){
    var boysId = findOrCreateSubject("Технология (мальчики)");
    var girlsId = findOrCreateSubject("Технология (девочки)");
    if(newPlan[boysId] && newPlan[girlsId]){
      newPlan[boysId].syncWith = girlsId;
      newPlan[girlsId].syncWith = boysId;
    }
  }

  state.curriculum[classId] = newPlan;
  // по какому документу и какой его версии заполнен план — для будущего «вышла новая сетка, обновить?» (ADR-4)
  var srcA = classPlanSource(cls);
  cls.appliedPlan = { source: srcA.kind, key: srcA.key || null, lang: orderLangKey(cls), ref: planRef(srcA), at: new Date().toISOString().slice(0,10) };
  // при автозаполнении «на просмотре» готовое расписание не стираем: план класса был пуст,
  // расписание просто станет неполным, а сверка с планом это покажет
  if(!(opts && opts.keepSchedule)) invalidateSchedule("plan");
  cls.officialPlanApplied = true;
}

/* ---------------- conflict detection (for manual edits) ---------------- */
function computeConflicts(){
  var conflicts = new Set();
  var teacherSlot = {}; // teacherId|day|globalSlot -> [ "classId|day|period", ... ]
  state.classes.forEach(function(c){
    var offset = classPeriodInfo(c).offset;
    var sched = state.schedule.byClass[c.id];
    if(!sched) return;
    sched.forEach(function(dayArr, d){
      dayArr.forEach(function(cell, p){
        if(!cell || !cell.lessons) return;
        var slot = offset + p;
        cell.lessons.forEach(function(lesson){
          if(!lesson.teacherId) return;
          var key = lesson.teacherId+"|"+d+"|"+slot;
          if(!teacherSlot[key]) teacherSlot[key] = [];
          teacherSlot[key].push(c.id+"|"+d+"|"+p);
        });
      });
    });
  });
  Object.keys(teacherSlot).forEach(function(k){
    if(teacherSlot[k].length > 1){
      teacherSlot[k].forEach(function(cellKey){ conflicts.add(cellKey); });
    }
  });
  return conflicts;
}

/* ---------------- scheduling engine ---------------- */
function mulberry32(seed){
  return function(){
    var t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function collectLockedCells(){
  var locked = [];
  if(!state.schedule) return locked;
  state.classes.forEach(function(c){
    var sched = state.schedule.byClass[c.id];
    if(!sched) return;
    sched.forEach(function(dayArr, d){
      dayArr.forEach(function(cell, p){
        if(cell && cell.locked) locked.push({ classId:c.id, day:d, period:p, cell:cell });
      });
    });
  });
  return locked;
}

/* ---------------- расписание после правок данных (P0-2, ФТ-8.4.3) ----------------
   Правка данных не стирает расписание: оно помечается «устарело — перестройте», а убираются
   только ячейки, ставшие невозможными (класс удалён, предмет убран из плана, пропал день или урок).
   Учитель урока следует за учебным планом; удалённый кабинет снимается с урока. */
function countFilled(grid){
  var n = 0;
  (grid || []).forEach(function(day){ (day || []).forEach(function(c){ if(c && c.lessons && c.lessons.length) n++; }); });
  return n;
}
function sanitizeSchedule(){
  var sc = state && state.schedule;
  if(!sc) return 0;
  if(!sc.byClass) sc.byClass = {};
  var removed = 0, nb = {};
  Object.keys(sc.byClass).forEach(function(cid){ if(!byId(state.classes, cid)) removed += countFilled(sc.byClass[cid]); });
  state.classes.forEach(function(c){
    var old = sc.byClass[c.id] || [];
    var plan = state.curriculum[c.id] || {};
    var days = classDays(c);
    var grid = [];
    for(var d=0; d<Math.max(days, old.length); d++){
      var oldRow = old[d] || [];
      if(d >= days){ removed += countFilled([oldRow]); continue; }
      var per = classPeriodsOn(c, d);
      var row = [];
      for(var p=0; p<Math.max(per, oldRow.length); p++){
        var cell = oldRow[p] || null;
        if(cell && (!cell.lessons || !cell.lessons.length)) cell = null;
        if(p >= per){ if(cell) removed++; continue; }
        if(cell){
          var valid = cell.lessons.every(function(l){ var e = plan[l.subjectId]; return e && e.hours > 0; });
          if(!valid){ removed++; cell = null; }
          else cell.lessons.forEach(function(l){
            l.teacherId = plan[l.subjectId].teacherId || null;
            if(l.roomId && !byId(state.rooms, l.roomId)) l.roomId = null;
          });
        }
        row.push(cell);
      }
      grid.push(row);
    }
    nb[c.id] = grid;
  });
  sc.byClass = nb;
  sc.unplaced = (sc.unplaced || []).filter(function(u){
    var e = byId(state.classes, u.classId) && (state.curriculum[u.classId] || {})[u.subjectId];
    if(e && e.hours > 0){ u.teacherId = e.teacherId || null; return true; }
    return false;
  });
  sc.unplacedCount = sc.unplaced.length;
  return removed;
}
/* Сколько закреплённых уроков и ручных правок без замка (ячейки) в расписании. */
function scheduleEditCounts(){
  var r = { locked: 0, manual: 0 };
  if(!state.schedule) return r;
  Object.keys(state.schedule.byClass).forEach(function(cid){
    state.schedule.byClass[cid].forEach(function(day){ day.forEach(function(c){
      if(!c) return;
      if(c.locked) r.locked++; else if(c.manual) r.manual++;
    }); });
  });
  return r;
}
function lockManualEdits(){
  if(!state.schedule) return;
  Object.keys(state.schedule.byClass).forEach(function(cid){
    state.schedule.byClass[cid].forEach(function(day){ day.forEach(function(c){ if(c && c.manual) c.locked = true; }); });
  });
}
/* Вызывается при любой правке данных, от которых зависит расписание (вместо state.schedule = null). */
function invalidateSchedule(reason){
  var sc = state.schedule;
  if(!sc) return;
  var removed = sanitizeSchedule();
  var wasStale = !!sc.stale;
  sc.stale = true;
  if(removed){
    sc.removedSinceGen = (sc.removedSinceGen || 0) + removed;
    notify(uzt("Из расписания убрано уроков, ставших невозможными: ")+removed, "warn");
  }
  if(!wasStale || removed){
    var cnt = scheduleEditCounts();
    track("schedule_invalidated", { reason: reason || "edit", removed: removed, locked: cnt.locked, manual: cnt.manual });
  }
}
/* Окна дня класса: пустые уроки до последнего урока дня (в т.ч. если день начинается не с 1-го). */
function rowWindows(row){
  var last = -1;
  for(var p=row.length-1; p>=0; p--){ if(row[p]){ last = p; break; } }
  var n = 0;
  for(var q=0; q<last; q++){ if(!row[q]) n++; }
  return n;
}
function countWindows(byClass){
  var n = 0;
  Object.keys(byClass).forEach(function(cid){ byClass[cid].forEach(function(row){ n += rowWindows(row); }); });
  return n;
}

/* Составление: 40 попыток, лучшая — меньше неразмещённых, при равенстве — меньше окон (P0-1). */
function generateSchedule(via){
  var t0 = Date.now();
  availCache = null;
  sanitizeSchedule();
  var lockedCells = collectLockedCells();
  var bestResult = null;
  var ATTEMPTS = 40;
  for(var attempt=0; attempt<ATTEMPTS; attempt++){
    var result = tryBuildOnce(attempt, lockedCells);
    result.windows = countWindows(result.byClass);
    if(!bestResult || result.unplaced.length < bestResult.unplaced.length ||
       (result.unplaced.length === bestResult.unplaced.length && result.windows < bestResult.windows)){
      bestResult = result;
      if(bestResult.unplaced.length === 0 && bestResult.windows === 0) break;
    }
  }
  state.schedule = {
    byClass: bestResult.byClass,
    unplaced: bestResult.unplaced,
    unplacedCount: bestResult.unplaced.length,
    windows: bestResult.windows,
    generatedAt: new Date().toISOString()
  };
  var conflicts = computeConflicts().size;
  track("generate_result", { via: via || "wizard", classes: state.classes.length, unplaced: bestResult.unplaced.length,
    conflicts: conflicts, windows: bestResult.windows, locked: lockedCells.length, duration_ms: Date.now() - t0 });
  milestone("schedule_generated");
  if(!bestResult.unplaced.length && !conflicts) milestone("schedule_clean");
}

var MAX_DAYS = 6; // безопасная верхняя граница для сеток занятости — конкретный класс может использовать меньше

/* Размер группы для проверки вместимости кабинета: задан в плане, иначе — класс, делённый на число групп. */
function memberGroupSize(m, cls, unit){
  if(m.groupSize) return m.groupSize;
  if(!cls.studentCount) return 0;
  return unit.members.length > 1 ? Math.ceil(cls.studentCount / unit.members.length) : cls.studentCount;
}
/* Сколько окон добавит (или уберёт, если < 0) урок длины size с позиции start в дне класса. */
/* Правила предмета (P1-5), на всю школу: subject.notPeriods — номера уроков, на которые предмет не ставится;
   subject.fixedSlot = { day, period } — «всегда в этот день этим уроком» (номера с 1). */
function ruleForbids(members, start, size){
  for(var mi=0; mi<members.length; mi++){
    var sj = byId(state.subjects, members[mi].subjectId);
    if(!sj || !sj.notPeriods || !sj.notPeriods.length) continue;
    for(var k=0; k<size; k++){ if(sj.notPeriods.indexOf(start + k + 1) >= 0) return true; }
  }
  return false;
}
function fixedSlotOf(members){
  for(var mi=0; mi<members.length; mi++){ var sj = byId(state.subjects, members[mi].subjectId); if(sj && sj.fixedSlot) return sj.fixedSlot; }
  return kelajakSlot(members); // правило школы «Kelajak soati — Пн, 1-й урок»
}
function windowsDelta(row, start, size){
  var after = row.map(function(c, p){ return c || (p >= start && p < start+size) ? 1 : null; });
  return rowWindows(after) - rowWindows(row);
}

function tryBuildOnce(seed, lockedCells){
  var rng = mulberry32(seed*97 + 13);
  var slots = totalSlotsPerDay();
  var AV = teacherAvail(); // выходные, день профразвития, закрытые уроки
  function offOn(tid, d){ var a = AV[tid]; return a ? a.off[d] : false; }
  function slotClosed(tid, d, slot){ var a = AV[tid]; return !!(a && a.nSlots && a.slots[d + "|" + slot]); }

  var teacherBusy = {}; // teacherId -> [day][slot] = classId or null
  state.teachers.forEach(function(t){
    teacherBusy[t.id] = [];
    for(var d=0; d<MAX_DAYS; d++){ teacherBusy[t.id].push(new Array(slots).fill(null)); }
  });
  var teacherDayCount = {}; // teacherId -> [day] lessons count
  state.teachers.forEach(function(t){ teacherDayCount[t.id] = new Array(MAX_DAYS).fill(0); });

  var roomBusy = {}; // roomId -> [day][slot] = classId or null
  state.rooms.forEach(function(r){
    roomBusy[r.id] = [];
    for(var d=0; d<MAX_DAYS; d++){ roomBusy[r.id].push(new Array(slots).fill(null)); }
  });

  var byClass = {};
  state.classes.forEach(function(c){
    var pinfo = classPeriodInfo(c);
    byClass[c.id] = [];
    for(var d=0; d<classDays(c); d++){ byClass[c.id].push(new Array(classPeriodsOn(c, d)).fill(null)); }
  });

  // Pre-seed locked cells before anything else is placed, so the generator
  // treats them as already-occupied ground truth and never moves or reuses them.
  var lockedHoursByClassSubject = {}; // "classId|subjectId" -> count
  (lockedCells||[]).forEach(function(lc){
    if(!byClass[lc.classId] || !byClass[lc.classId][lc.day] || lc.period >= byClass[lc.classId][lc.day].length) return;
    var cls = byId(state.classes, lc.classId);
    var offset = classPeriodInfo(cls).offset;
    byClass[lc.classId][lc.day][lc.period] = lc.cell;
    var globalSlot = offset + lc.period;
    lc.cell.lessons.forEach(function(lesson){
      var key = lc.classId+"|"+lesson.subjectId;
      lockedHoursByClassSubject[key] = (lockedHoursByClassSubject[key]||0) + 1;
      if(lesson.roomId && roomBusy[lesson.roomId]) roomBusy[lesson.roomId][lc.day][globalSlot] = lc.classId;
      if(!lesson.teacherId) return;
      if(teacherBusy[lesson.teacherId]) teacherBusy[lesson.teacherId][lc.day][globalSlot] = lc.classId;
      if(teacherDayCount[lesson.teacherId] !== undefined) teacherDayCount[lesson.teacherId][lc.day]++;

      var m = unit.members[mi];
      var subj = byId(state.subjects, m.subjectId);
      if(!subj || !subj.roomType || !state.rooms.length){ out[m.subjectId] = null; continue; }
      var need = memberGroupSize(m, cls, unit);
      var chosen = state.rooms.filter(function(r){
        return r.type === subj.roomType && (!need || r.capacity >= need) && !used[r.id] &&
          globalSlots.every(function(slot){ return !roomBusy[r.id][d][slot]; });
      }).sort(function(a,b){ return (a.capacity||0) - (b.capacity||0); })[0];

    });
  }
  function occupy(rec){

        var gs = slotsOf(probe, st), bad = null;

    var units = computeUnits(cls.id).map(function(u){

    }).filter(function(u){ return u.hours > 0; });
    // сначала уроки с правилом «всегда …» (и «Kelajak soati»), затем математика 1–4 по правилу школы, чтобы их место

    units.forEach(function(u){ u.fixed = fixedSlotOf(u.members); u.mathRule = primaryMathPeriod(cls, u.members, 1) !== null; });

    units.forEach(function(unit){

          if(!teacher) return false;

      }
      // правило «всегда в день D уроком P»: одно занятие ставится ровно туда, иначе — неразмещённое с причиной

          var frec = { cls: cls, unit: unit, size: fsz, offset: offset, d: fd, start: fs, rooms: frooms, fixed: true };

        }
      }
      // математика 1–4 по правилу школы: по одному уроку в день на его место (Пн — 2-й урок, остальные дни — 1-й);
      // что не встало на своё место — обычной расстановкой ниже (проверка покажет это как рекомендацию)
      if(unit.mathRule && !sameTeacher){
        for(var md=0; md<days && placements.length; md++){
          if(placements[0] !== 1) break;
          var mp = primaryMathPeriod(cls, unit.members, md) - 1;
          var mprobe = { cls: cls, unit: unit, size: 1, offset: offset };
          if(mp >= byClass[cls.id][md].length || !classFreeAt(mprobe, md, mp) || !teacherOkOn(md, 1)) continue;
          var mgs = slotsOf(mprobe, mp);
          if(!teachersFreeAt(mprobe, md, mgs)) continue;
          var mrooms = pickRooms(cls, unit, md, mgs);
          if(!mrooms) continue;
          var mrec = { cls: cls, unit: unit, size: 1, offset: offset, d: md, start: mp, rooms: mrooms, fixed: true };
          occupy(mrec); recs.push(mrec); dayLoad[md] += 1; usedDaysForUnit[md] = true;
          placements.shift();
        }
      }

      placements.forEach(function(size){
        var best = null;
        // проход 0 — не больше одного раза в день; проход 1 — если иначе не встаёт

        if(best){
          var rec = { cls: cls, unit: unit, size: size, offset: offset, d: best.d, start: best.start, rooms: best.rooms };
          occupy(rec);
          recs.push(rec);
          dayLoad[best.d] += size;
          usedDaysForUnit[best.d] = true;
        } else {
          var why = sameTeacher ? { code: "same_teacher" } : diagnose(cls, unit, size, offset);
          unit.members.forEach(function(m){
            unplaced.push({ classId: cls.id, subjectId: m.subjectId, teacherId: m.teacherId, reason: why });
          });
        }
      });
    });
  });

  // Уплотнение: окно в дне класса закрывается переносом более позднего урока того же дня,
  // если учитель и кабинет в новом месте свободны. Закреплённые уроки не двигаются.
  state.classes.forEach(function(cls){
    var recs = recsByClass[cls.id] || [];

            var rooms = classFreeAt(rec, d, hole) && teachersFreeAt(rec, d, gs) ? pickRooms(cls, rec.unit, d, gs) : null;
            if(rooms){
              rec.start = hole; rec.rooms = rooms; occupy(rec);
              if(rowWindows(row) < before){ moved = true; continue; }
              release(rec); // перенос не уменьшил окна — возвращаем
            }
            rec.start = oldStart; rec.rooms = oldRooms; occupy(rec);
          }
        }
        if(!moved) break;
      }

  return { byClass: byClass, unplaced: unplaced };
}
function lexLess(a, b){

function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }

/* ---------------- eMaktab staff export parser ----------------

   (Excel opens it via content-sniffing), not a real .xls binary.

   Должность, Классы, Телефоны, Эл. почта. We only keep ФИО and Классы. */
/* Разбор отчёта: строка заголовков ищется среди первых строк; русские и узбекские заголовки;
   должность читается, чтобы отличить учителей, но не сохраняется. */
function staffHeaderKind(txt){
  var t0 = String(txt).toLowerCase().replace(/[ʻʼ'`’.]/g, "").replace(/\s+/g, " ").trim();
  if(/^(фио|ф и о|fio|f i o|fish|f i sh|ism familiya|familiya ism|familiya ismi sharifi|xodim)/.test(t0)) return "name";
  if(/^(должность|lavozim|lavozimi)/.test(t0)) return "position";
  if(/^(классы|класс|sinflar|sinf)/.test(t0)) return "classes";

}
function parseStaffExport(text){
  var doc = new DOMParser().parseFromString(text, "text/html");

  var trs = table.querySelectorAll("tr");
  function cellsOf(tr){ return Array.prototype.map.call(tr.querySelectorAll("td,th"), function(c){ return c.textContent.replace(/\u00a0/g," ").trim(); }); }

  for(var i=hi+1; i<trs.length; i++){
    var cells = cellsOf(trs[i]);
    var name = cells[idx.name];
    if(!name) continue;

  }

}
/* Предпросмотр импорта: кто будет добавлен. Учитель — по должности (пустая должность — тоже);

    if(existing[key]){ item.include = false; item.kind = "exists"; item.note = uzt("уже есть в списке"); }
    else if(seen[key]){ item.include = false; item.kind = "dup"; item.note = uzt("совпадает ФИО — проверьте"); seen[key].kind = "dup"; seen[key].note = uzt("совпадает ФИО — проверьте"); }
    else if(isAdminPosition(r.position)){ item.include = false; item.kind = "admin"; item.note = uzt("ведёт уроки? отметьте"); }

function importPreviewHtml(){

  var h = '<div class="imp">';
  h += '<div class="imp-file">'+escHtml(P.fileName)+' · '+nWord(P.rows.length, ["сотрудник","сотрудника","сотрудников"], "ta xodim")+'</div>';

  h += '<div class="imp-tile"><strong>'+other+'</strong>'+escHtml(uzt("не учителя — пропущены по должности"))+'</div>';
  h += '<div class="imp-tile warn"><strong>'+check+'</strong>'+escHtml(uzt("проверьте: совпадения и администрация"))+'</div></div>';
  h += '<div class="table-wrap imp-table"><table><thead><tr><th></th><th>'+escHtml(uzt("ФИО"))+'</th><th>'+escHtml(uzt("Должность"))+'</th><th>'+escHtml(uzt("Классы"))+'</th><th></th></tr></thead><tbody>';

    h += '<td>'+escHtml(r.name)+'</td><td>'+escHtml(r.position || "—")+'</td><td>'+escHtml(r.classesRaw || "—")+'</td>';
    h += '<td class="'+(r.kind==="dup"||r.kind==="admin"?"imp-warn":"muted")+'">'+escHtml(r.note)+'</td></tr>';

  h += '<p class="muted">'+escHtml(uzt("ПИНФЛ, телефоны, почта и даты рождения не сохраняются; должность нужна только для этого списка."))+'</p>';
  h += '<div class="row"><button class="btn btn-primary" data-imp-act="apply"'+(inc?"":" disabled")+'>'+escHtml(uzt("Добавить учителей: ")+inc)+'</button><button class="btn" data-imp-act="cancel">'+escHtml(uzt("Отмена"))+'</button></div>';

/* Добавить отмеченных. В мастере заодно создаются классы из колонки «Классы» (5-А и 5-A — один класс). */
function applyImportPreview(){
  var P = importPreview; if(!P) return { teachers: 0, classes: 0 };
  var addedT = 0, addedC = 0, names = {};

    if(!r.include) return;
    state.teachers.push({ id: uid("teach"), name: r.name, subjects: [], maxPerDay: null, daysOff: new Array(MAX_DAYS).fill(false), homeroomNote: r.classesRaw || "" });
    addedT++;
    if(r.classesRaw) r.classesRaw.split(/[,;]/).forEach(function(tok){ var nm = tok.trim(); if(nm) names[nm] = true; });
  });

    var keys = {};

function readStaffFile(file, via, done){

  if(!tg || !importPreview) return;
  var act = tg.getAttribute("data-imp-act");
  if(act === "toggle" && e.type === "change"){ var r = importPreview.rows[parseInt(tg.getAttribute("data-i"),10)]; if(r) r.include = tg.checked; render(); }
  else if(act === "cancel" && e.type === "click"){ importPreview = null; render(); }

    var via = importPreview.via, res = applyImportPreview();
    notify(uzt("Добавлено учителей: ")+res.teachers+(res.classes ? uzt(", классов: ")+res.classes : ""), "ok");

/* ================= ИМПОРТ ИЗ eMaktab (пилот, v0.10; docs/Пилот_импорт_eMaktab.md, раздел 5.2) =================

   Импорт заменяет данные школы; повторный импорт сохраняет id и настройки учителей, классов и кабинетов,

  return s.replace(/ /g, " ").trim();
}

  var A = emkAoa(wb);
  if(A.length && /^(класс|sinf)\s*:/i.test(emkDec(A[0][0]))) return { kind: "classweek" };

/* Сетка по учителям: строка «Учитель», в ней дни (объединённые ячейки), ниже номера уроков; строка — учитель;

      gridTC[k] = (gridTC[k] || 0) + 1; gridCS[l.cls + "|" + emkNorm(l.full || "")] = true;
    });
    // сколько уроков за период приходится на 1 час в неделю (≈ число прошедших недель)
    var ratios = [];
    L.rows.forEach(function(x){ var w = gridTC[emkTKey(x.t) + "|" + x.cls + "|" + emkNorm(x.subj)]; if(w) ratios.push(x.n / w); });
    ratios.sort(function(a, b){ return a - b; });
    var perHour = ratios.length ? ratios[Math.floor(ratios.length / 2)] : 0, seenLo = {};
    L.rows.forEach(function(x){
      var k = x.t + "|" + x.subj + "|" + x.cls;
      if(seenLo[k] || gridTC[emkTKey(x.t) + "|" + x.cls + "|" + emkNorm(x.subj)]) return;
      seenLo[k] = true;
      if(gridCS[x.cls + "|" + emkNorm(x.subj)] || (perHour && x.n < perHour * 0.5)){ loadHidden++; return; }
      inLoadOnly.push(x.cls + " — " + x.subj + " (" + x.t + ")");
    });
    inGridOnly = dedupe(lessons.filter(function(l){ return !l.full; }).map(function(l){ return l.cls + " — " + l.subj + " (" + l.t + ")"; }));
  } else if(!L){
    notes.push({ kind: "info", text: uzt("Без учебной нагрузки названия предметов останутся обрезанными, как в сетке («Узбекский я...»). Сопоставьте их со справочником ниже или загрузите нагрузку.") });
  }
  // неполная неделя: в какой-то будний день заметно меньше уроков, чем в среднем
  var perDay = [0,0,0,0,0,0];
  lessons.forEach(function(l){ perDay[l.d]++; });
  var busyDays = perDay.slice(0, 5).filter(Boolean), avg = busyDays.reduce(function(a,b){ return a+b; }, 0) / Math.max(1, busyDays.length);
  var thin = [];
  for(var d=0; d<5; d++){ if(perDay[d] < avg * 0.4) thin.push(DAY_NAMES_6[d]); }
  if(thin.length) notes.push({ kind: "warn", text: uzt("Мало уроков: ") + thin.join(", ") + uzt(" — возможно, праздник или сокращённый день. Лучше выгрузить обычную неделю четверти.") });
  if(G.odd) notes.push({ kind: "warn", text: uzt("Не удалось прочитать ячеек сетки: ") + G.odd + "." });

  // учителя: ключ без пробелов и точек; обрезанное ФИО — по началу; имя берётся из нагрузки, если там оно полнее
  var tNames = {}, loadNames = L ? dedupe(L.rows.map(function(x){ return x.t; })) : [];
  lessons.forEach(function(l){ if(emkNoTeacher(l.t)) return; var k = emkTKey(l.t); if(!tNames[k] || emkTruncated(tNames[k])) tNames[k] = l.t; });
  var tKeys = Object.keys(tNames), tAlias = {};
  tKeys.forEach(function(k){
    if(!emkTruncated(tNames[k])) return;
    var full = tKeys.filter(function(o){ return o !== k && o.indexOf(k) === 0 && !emkTruncated(tNames[o]); });
    if(full.length === 1) tAlias[k] = full[0];
    else { var fl = loadNames.filter(function(n){ return emkTKey(n).indexOf(k) === 0; }); if(fl.length === 1) tNames[k] = fl[0]; }
  });
  lessons.forEach(function(l){ l.tk = emkNoTeacher(l.t) ? null : (tAlias[emkTKey(l.t)] || emkTKey(l.t)); });
  var teachers = {};
  lessons.forEach(function(l){ if(l.tk) teachers[l.tk] = tNames[l.tk]; });

  // предметы для сопоставления
  var subj = {};
  lessons.forEach(function(l){
    var ext = l.full || l.subj;
    if(!subj[ext]) subj[ext] = { ext: ext, truncated: !l.full && emkTruncated(l.subj), count: 0 };
    subj[ext].count++;
  });
  var subjects = Object.keys(subj).map(function(k){ var s = subj[k], m = emkMatchSubject(s.ext, s.truncated); s.target = m.target; s.status = m.status; return s; });
  var order = { "new": 0, guess: 1, alias: 2, saved: 3, ok: 4 };
  subjects.sort(function(a, b){ return order[a.status] - order[b.status] || b.count - a.count; });

  // классы: диапазон уроков и дни по сетке
  var classes = {};
  lessons.forEach(function(l){
    var c = classes[l.cls] = classes[l.cls] || { raw: l.cls, name: emkClassName(l.cls), min: 99, max: 0, days: {}, n: 0 };
    c.min = Math.min(c.min, l.p); c.max = Math.max(c.max, l.p); c.days[l.d] = true; c.n++;
  });
  var rooms = dedupe(lessons.map(function(l){ return l.room; }).filter(function(r){ return !emkNoRoom(r); }));
  var groups = {};
  lessons.forEach(function(l){ if(l.grp) groups[l.cls + "|" + (l.full || l.subj)] = true; });
  var dayLbl = G.days.filter(Boolean);
  emk.data = {
    lessons: lessons, teachers: teachers, subjects: subjects, classes: classes, rooms: rooms, notes: notes,
    groupSubjects: Object.keys(groups).length, groupLabels: dedupe(lessons.map(function(l){ return l.grp; }).filter(Boolean)),
    inLoadOnly: inLoadOnly, inGridOnly: inGridOnly, loadHidden: loadHidden, loadUsed: loadUsed,
    week: dayLbl.length ? dayLbl[0] + " — " + dayLbl[Math.min(dayLbl.length, 7) - 1] : ""
  };
}

/* Чтение выбранных файлов (можно оба сразу, можно по одному и повторно — новый файл того же вида заменяет прежний). */
function emkReadFiles(fileList, via){
  var files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;
  emk.busy = true; emk.error = null; emk.via = via || "wizard";
  render();
  var left = files.length, errors = [];
  files.forEach(function(f){
    var reader = new FileReader();
    reader.onload = function(ev){
      // разбор большой школы занимает 1–3 с — отдаём браузеру кадр, чтобы показалось «Читаю файл…»
      setTimeout(function(){
        var kind = "unknown";
        try{
          var wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
          var det = emkDetect(wb); kind = det.kind;
          if(det.kind === "grid"){ var g = emkParseGrid(det.A, det.hr); if(!g.lessons.length) kind = "empty"; else emk.files.grid = { name: f.name, parsed: g }; }
          else if(det.kind === "load"){ var ld = emkParseLoad(det.A, det.hr); if(!ld.rows.length) kind = "empty"; else emk.files.load = { name: f.name, parsed: ld }; }
        }catch(e){ kind = "unreadable"; }
        if(kind !== "grid" && kind !== "load"){ errors.push({ name: f.name, kind: kind }); track("import_emaktab_result", { ok: false, reason: kind, via: emk.via }); }
        if(--left === 0){
          emk.busy = false; emk.error = errors.length ? errors : null;
          try{ emkBuild(); }catch(e){ emk.data = null; emk.error = [{ name: "", kind: "unreadable" }]; }
          render();
        }
      }, 30);
    };
    reader.onerror = function(){ errors.push({ name: f.name, kind: "unreadable" }); if(--left === 0){ emk.busy = false; emk.error = errors; render(); } };
    reader.readAsArrayBuffer(f);
  });
}
function emkErrorText(e){

/* Самый частый элемент. */
function emkMode(arr){ var cnt = {}, best = null; arr.forEach(function(x){ cnt[x] = (cnt[x] || 0) + 1; if(best === null || cnt[x] > cnt[best]) best = x; }); return best; }
/* Предмет-вариант группы: «Английский язык (группа 2)» — так же, как кнопка «Разделить на группы» в плане. */
function emkGroupSubject(baseId, n){
  var bs = byId(state.subjects, baseId), baseName = bs ? bs.name : "";
  var id = findOrCreateSubject(baseName + " (группа " + n + ")"), s = byId(state.subjects, id);
  if(s && !s.nameUz) s.nameUz = ((bs && bs.nameUz) || baseName) + " (" + n + "-guruh)";
  return id;
}

/* Перенос в данные конструктора. Возвращает сводку для уведомления и аналитики. */
function emkApply(){
  var D = emk.data, t0 = Date.now();
  if(!D) return null;
  // предметы
  var subjOf = {}, subjectMap = (state.emaktab && state.emaktab.subjectMap) || {}, created = 0;
  D.subjects.forEach(function(s){
    var id = s.target;
    if(id === "new" || !byId(state.subjects, id)){ var before = state.subjects.length; id = findOrCreateSubject(s.ext.replace(/(\.\.\.|…)$/, "")); if(state.subjects.length > before) created++; }
    subjOf[s.ext] = id; subjectMap[s.ext] = id;
  });
  // учителя, классы и кабинеты прежней загрузки (или совпадающие по названию) сохраняют id и настройки
  var oldT = {}, oldC = {}, oldR = {};
  state.teachers.forEach(function(t){ oldT[emkTKey((t.ext && t.ext.emaktab) || t.name)] = t; });
  state.classes.forEach(function(c){ oldC[classKey((c.ext && c.ext.emaktab) || c.name)] = c; });
  state.rooms.forEach(function(r){ oldR[String((r.ext && r.ext.emaktab) || r.name).trim().toLowerCase()] = r; });
  var tId = {}, teachers = [];
  Object.keys(D.teachers).forEach(function(k){
    var raw = D.teachers[k], t = oldT[k] || { id: uid("teach"), subjects: [], maxPerDay: null, daysOff: new Array(MAX_DAYS).fill(false) };
    t.name = raw.replace(/(\.\.\.|…)$/, ""); t.ext = { emaktab: raw };
    tId[k] = t.id; teachers.push(t);
  });
  var rId = {}, rooms = [];
  D.rooms.forEach(function(nm){
    var r = oldR[nm.trim().toLowerCase()] || { id: uid("room"), name: nm, capacity: null, type: null };
    r.ext = { emaktab: nm }; rId[nm] = r.id; rooms.push(r);
  });
  // классы: дни, первый урок и уроки по дням — из сетки; общее для параллели выносится в параллель
  ensureParallels(state);
  var clsList = [], sig = {};
  Object.keys(D.classes).forEach(function(raw){
    var x = D.classes[raw], m = String(x.name).match(/^(\d{1,2})/), grade = m && +m[1] >= 1 && +m[1] <= 11 ? +m[1] : null;
    var days = x.days[5] ? 6 : 5, per = [];
    for(var d=0; d<6; d++){
      var mx = 0;
      if(d < days) D.lessons.forEach(function(l){ if(l.cls === raw && l.d === d && l.p > mx) mx = l.p; });
      per.push(mx ? mx - x.min + 1 : 0);
    }
    var c = oldC[classKey(raw)] || oldC[classKey(x.name)];
    // язык обучения — по предметам; у класса прежней загрузки остаётся тот, что поставил завуч
    var ru = D.lessons.some(function(l){ return l.cls === raw && /родной \(рус|рус\. литер|русская литер/i.test(l.full || l.subj); });
    if(!c) c = newClassObj(grade, "A", ru ? "ru" : "uz");
    else if(!c.ext || c.langGuessed) c.instructionLang = ru ? "ru" : "uz";
    if(!c.ext || c.langGuessed) c.langGuessed = true;
    c.name = x.name; c.grade = grade; c.ext = { emaktab: raw }; c.isHomeschool = false;
    c.officialPlanApplied = false; c.appliedPlan = null;
    clsList.push(c); sig[c.id] = { days: days, start: x.min, per: per };
  });
  for(var g=1; g<=11; g++){
    var inG = clsList.filter(function(c){ return c.grade === g; });
    if(!inG.length) continue;
    var P = state.config.parallels[g];

    P.start = emkMode(inG.map(function(c){ return sig[c.id].start; }));
    var perKey = emkMode(inG.map(function(c){ return JSON.stringify(sig[c.id].per.slice(0, P.days)); })), pArr = JSON.parse(perKey);

/* ================= СВЕРКА С УЧЕБНЫМ ПЛАНОМ И НАПРАВЛЕНИЕ КЛАССА (ФТ-17.4, ФТ-17.5) =================
   Часы класса (из eMaktab или заданные вручную) сравниваются с официальным планом по его параметрам:
   язык, направление (приказы №183, №227), Жасорат. Предметы вне справочника ЕСП («Кл. час») не сверяются.
   Направление в выгрузках eMaktab не видно, но видно по предметам ЕСП: «… по выбору» / «… tanlov», «… вариатив»,
   «… Экономика» / «… Iqtisodiyot», «… Жасорат» — по ним предлагается направление с вопросом завучу. */
var PLAN_DIR_NAME = / по выбору$| вариатив$| Экономика$| Жасорат$| как второй иностранный язык$/;
/* Ключ сверки: группы и варианты технологии — один предмет плана. */
/* Одно и то же в плане и в eMaktab под разными именами ЕСП: в русских классах eMaktab пишет «Узбекский язык». */
var PLAN_SAME = { "Государственный язык (узбекский)": "Узбекский язык" };
function planKey(name){
  var k = String(name).replace(/ \(группа \d+\)$/, "").replace(/ \((мальчики|девочки|общий класс|сельское хозяйство)\)$/, "");
  return PLAN_SAME[k] || k;
}
function planCatalogHas(name){ return catalogHas(name) || catalogHas(planKey(name)); }
/* Часы класса по ключам сверки: у пары групп — одни часы (берётся больший). */
function classPlanHave(c){
  var have = {}, plan = state.curriculum[c.id] || {};
  Object.keys(plan).forEach(function(sid){
    var e = plan[sid]; if(!(e.hours > 0)) return;
    var k = planKey(subjectRawName(sid)); if(!k) return;
    have[k] = Math.max(have[k] || 0, e.hours);
  });
  return have;
}
function officialNeed(c){
  var need = {};
  computeOfficialPlan(c).forEach(function(r){ var k = planKey(r.name); need[k] = Math.max(need[k] || 0, r.hours); });
  return need;
}
/* В русских классах родной язык — русский: eMaktab пишет «Рус. язык», в плане — «Родной язык». */
function planReconcile(c, have, need){
  if(c.instructionLang === "ru" && have["Русский язык"] && !need["Русский язык"] && need["Родной язык"] && !have["Родной язык"]){
    have = Object.assign({}, have); have["Родной язык"] = have["Русский язык"]; delete have["Русский язык"];
  }
  return have;
}
/* Официальный план при другом направлении — параметры класса временно подменяются. */
function officialNeedWith(c, dir){
  var keep = { track: c.track, variativ: c.variativ, jasorat: c.jasorat, secondForeignLang: c.secondForeignLang };
  c.track = dir.track || "none"; c.variativ = dir.variativ || null; c.jasorat = !!dir.jasorat;
  if(dir.secondForeignLang) c.secondForeignLang = dir.secondForeignLang;
  try{ return officialNeed(c); } finally { c.track = keep.track; c.variativ = keep.variativ; c.jasorat = keep.jasorat; c.secondForeignLang = keep.secondForeignLang; }
}
function hoursOk(have, need){ return need % 1 ? (have === Math.floor(need) || have === Math.ceil(need)) : have === need; }

  var d = 0, keys = dedupe(Object.keys(have).concat(Object.keys(need)));
  keys.forEach(function(k){ if(!planCatalogHas(k)) return; var h = have[k] || 0, n = need[k] || 0; if(!hoursOk(h, n)) d += Math.abs(h - n); });
  return d;
}
function classHasDirection(c){ return !!(c.variativ || (c.track && c.track !== "none") || c.jasorat); }
function directionLabel(dir){
  if(dir.variativ) return vdirLabel(dir.variativ);
  if(dir.track) return trackLabel(dir.track);
  if(dir.jasorat) return uzt("Жасорат");
  return uzt("Без направления");
}
/* Возможные направления класса (как в списке «Направление» на шаге «Классы и режим»). */
function directionCandidates(c){
  var out = [], crit = state.config.schoolType === "criterial", lk = orderLangKey(c);
  if(crit && (c.grade === 5 || c.grade === 6)) out.push({ jasorat: true });
  if(c.grade >= 7 && c.grade <= 11 && !c.isHomeschool && lk){
    VARIATIV_DIRECTIONS.forEach(function(d){ var tb = ORDER_PLANS["227"][d.key][lk]; if(tb && tb.g.indexOf(c.grade) >= 0) out.push({ variativ: d.key }); });
    if(crit && c.grade >= 10){
      TRACK_OPTIONS.forEach(function(tr){
        if(tr.key === "none" || !ORDER_PLANS["183"][tr.key] || !ORDER_PLANS["183"][tr.key][lk]) return;
        var cand = { track: tr.key };
        if(tr.needsSecondLang){

/* Предложение направления: только если у класса есть предметы по направлению и с ним план сходится лучше. */

    var need = officialNeedWith(c, dir), ev = marks.filter(function(k){ return need[k]; });
    if(!ev.length) return;
    var d = planDistance(planReconcile(c, have, need), need);
    if(!best || d < best.d || (d === best.d && ev.length > best.ev.length)) best = { dir: dir, d: d, ev: ev };

}
/* Расхождения часов класса с официальным планом; «стоит «Алгебра», по направлению нужна «Алгебра Экономика»». */
function planDiff(c){

    var h = have[k] || 0, n = need[k];
    if(h || !PLAN_DIR_NAME.test(k)) return;

    }
  });
  Object.keys(need).forEach(function(k){
    if(used[k]) return;
    var h = have[k] || 0, n = need[k];
    if(hoursOk(h, n)) return;
    items.push(h ? { kind: "hours", name: k, have: h, need: n } : { kind: "missing", name: k, need: n });
  });
  Object.keys(have).forEach(function(k){
    if(used[k] || need[k] || !planCatalogHas(k) || CLASS_HOUR_RE.test(k)) return; // «Kelajak soati» — не из учебного плана
    items.push({ kind: "extra", name: k, have: have[k] });

function subjByRaw(name){ var s = state.subjects.filter(function(x){ return x.name === name; })[0]; return s ? subjDisplay(s) : name; }
function planItemText(x){
  var h = function(v){ return String(v).replace(".", ",") + uzt(" ч"); };
  if(x.kind === "dir") return uzt("стоит «") + subjByRaw(x.base) + uzt("», а по направлению нужен «") + subjByRaw(x.name) + "» (" + h(x.need) + ")";
  if(x.kind === "hours") return subjByRaw(x.name) + ": " + h(x.have) + uzt(" вместо ") + h(x.need);
  if(x.kind === "missing") return uzt("нет «") + subjByRaw(x.name) + "» (" + h(x.need) + ")";

/* «Поставить» направление из предложения: та же настройка, что на шаге «Классы и режим». */
function applyDirection(c, dir){

/* ================= ПРОВЕРКА РАСПИСАНИЯ (раздел 5.3) =================
   Считается по текущей сетке при каждом показе: конфликты учителей (с пометкой «возможно, объединённый урок»,
   если у классов один кабинет), кабинет у двух классов, два урока в ячейке класса (не группы), окна у классов,
   урок в выходной учителя, перегруз — если у учителя задан максимум уроков в день. */
var checkFocus = null; // "classId|d|p" — ячейка, к которой перешли из проверки
function checkSchedule(){
  availCache = null;
  var R = { teacher: [], combined: [], room: [], roomGroups: [], clash: [], windows: [], overDay: [], overWeek: [], dayOff: [], pdOff: [], slotOff: [], rules: [], windowsTotal: 0, plan: [], dirSuggest: [] };
  state.classes.forEach(function(c){
    var sg = suggestDirection(c); if(sg) R.dirSuggest.push({ classId: c.id, dir: sg.dir, ev: sg.ev });
    var pd = planDiff(c); if(pd) R.plan.push(pd);
  });
  var sc = state.schedule;
  if(!sc) return R;
  var tSlot = {}, rSlot = {}, tDay = {}, tWeek = {};
  state.classes.forEach(function(c){
    var off = classPeriodInfo(c).offset, g = sc.byClass[c.id], plan = state.curriculum[c.id] || {};
    if(!g) return;
    var win = { classId: c.id, n: 0, days: [], d: -1, p: -1 };
    g.forEach(function(row, d){
      var w = rowWindows(row);
      if(w){
        win.n += w; win.days.push(d);
        if(win.d < 0){ for(var q=0; q<row.length; q++){ if(!row[q]){ var later = row.slice(q).some(Boolean), before = row.slice(0, q).some(Boolean); if(later && before){ win.d = d; win.p = q; break; } } } }
      }
      row.forEach(function(cell, p){
        if(!cell || !cell.lessons || !cell.lessons.length) return;
        var slot = off + p;
        if(cell.lessons.length > 1){
          var grp = cell.lessons.every(function(l){ var e = plan[l.subjectId]; return e && ((e.ext && e.ext.group) || (e.syncWith && cell.lessons.some(function(o){ return o.subjectId === e.syncWith; }))); });
          if(!grp) R.clash.push({ classId: c.id, d: d, p: p });
        }
        cell.lessons.forEach(function(l){
          if(l.teacherId){
            var k = l.teacherId + "|" + d + "|" + slot;
            (tSlot[k] = tSlot[k] || []).push({ classId: c.id, p: p, roomId: l.roomId });
            tDay[l.teacherId + "|" + d] = (tDay[l.teacherId + "|" + d] || 0) + 1;
            tWeek[l.teacherId] = (tWeek[l.teacherId] || 0) + 1;
            var tc = byId(state.teachers, l.teacherId);
            if(tc && tc.daysOff && tc.daysOff[d]) R.dayOff.push({ teacherId: l.teacherId, classId: c.id, d: d, p: p });
            else if(tc && teacherPdDay(tc) === d) R.pdOff.push({ teacherId: l.teacherId, classId: c.id, d: d, p: p });
            if(tc && teacherSlotClosed(tc.id, d, slot)) R.slotOff.push({ teacherId: l.teacherId, classId: c.id, d: d, p: p });
          }
          if(l.roomId){ var rk = l.roomId + "|" + d + "|" + slot; (rSlot[rk] = rSlot[rk] || []).push({ classId: c.id, p: p, teacherId: l.teacherId }); }
        });

    });

  });
  Object.keys(tSlot).forEach(function(k){
    var a = tSlot[k], cls = dedupe(a.map(function(x){ return x.classId; }));
    if(cls.length < 2) return;
    var parts = k.split("|"), item = { teacherId: parts[0], d: +parts[1], slot: +parts[2], cells: a };
    var room = a[0].roomId;
    if(room && a.every(function(x){ return x.roomId === room; })){ item.roomId = room; R.combined.push(item); } else R.teacher.push(item);
  });
  Object.keys(rSlot).forEach(function(k){
    var a = rSlot[k], cls = dedupe(a.map(function(x){ return x.classId; }));
    if(cls.length < 2) return;
    var t0 = a[0].teacherId;
    if(t0 && a.every(function(x){ return x.teacherId === t0; })) return; // один учитель — это «возможно, объединённый урок»
    if(checkSharedRoom(roomName(k.split("|")[0]))) return; // спортзал, актовый зал, площадка — там бывает несколько классов
    var parts = k.split("|");
    R.room.push({ roomId: parts[0], d: +parts[1], slot: +parts[2], cells: a });
  });
  state.teachers.forEach(function(tc){
    if(!tc.maxPerDay) return;
    for(var d=0; d<MAX_DAYS; d++){ var n = tDay[tc.id + "|" + d] || 0; if(n > tc.maxPerDay) R.overDay.push({ teacherId: tc.id, d: d, n: n, max: tc.maxPerDay }); }
    var cap = teacherCapacity(tc);
    if((tWeek[tc.id] || 0) > cap) R.overWeek.push({ teacherId: tc.id, n: tWeek[tc.id], max: cap });
  });
  var bySlot = function(a, b){ return a.d - b.d || a.slot - b.slot; };
  R.teacher.sort(bySlot); R.combined.sort(bySlot); R.room.sort(bySlot);
  // по кабинетам: «каб. A-304 — 12 уроков: 1-F, 2-B» (в выгрузках кабинет часто закреплён за классом, совпадений много)
  var rooms = {};
  R.room.forEach(function(x){ var r = rooms[x.roomId] = rooms[x.roomId] || { roomId: x.roomId, n: 0, classes: [], first: x }; r.n++; x.cells.forEach(function(c){ if(r.classes.indexOf(c.classId) < 0) r.classes.push(c.classId); }); });
  R.roomGroups = Object.keys(rooms).map(function(k){ return rooms[k]; }).sort(function(a, b){ return b.n - a.n; });
  R.windows.sort(function(a, b){ return b.n - a.n; });
  R.rules = checkSchoolRules();
  return R;
}
/* Правила школы — рекомендации (0.11, А7): «Kelajak soati» не первым уроком понедельника или его нет у класса;
   математика 1–4 не на своём месте. Проверяются, только если завуч ответил «да». */
function checkSchoolRules(){
  var out = [], rules = schoolRules(), sc = state.schedule;
  if(!sc) return out;
  state.classes.forEach(function(c){
    var g = sc.byClass[c.id];
    if(!g || c.isHomeschool) return;
    if(rules.kelajak === true){
      var at = [];
      g.forEach(function(row, d){ row.forEach(function(cell, p){ if(cell && cell.lessons && cell.lessons.some(function(l){ return isClassHourSubj(l.subjectId); })) at.push({ d: d, p: p }); }); });
      if(!at.length){
        var inPlan = Object.keys(state.curriculum[c.id] || {}).some(function(sid){ return isClassHourSubj(sid) && state.curriculum[c.id][sid].hours > 0; });
        out.push({ kind: inPlan ? "kelajak_unplaced" : "kelajak_missing", classId: c.id });
      } else if(!at.some(function(x){ return x.d === 0 && x.p === 0; })) out.push({ kind: "kelajak_pos", classId: c.id, d: at[0].d, p: at[0].p });
    }
    if(rules.primaryMath === true && c.grade >= 1 && c.grade <= 4){
      var bad = [];
      g.forEach(function(row, d){ row.forEach(function(cell, p){
        if(!cell || !cell.lessons || !cell.lessons.some(function(l){ return isMathSubj(l.subjectId); })) return;
        if(p !== primaryMathPeriod(c, [{ subjectId: cell.lessons.filter(function(l){ return isMathSubj(l.subjectId); })[0].subjectId }], d) - 1) bad.push({ d: d, p: p });
      }); });
      if(bad.length) out.push({ kind: "math_pos", classId: c.id, d: bad[0].d, p: bad[0].p, n: bad.length });
    }
  });
  return out;
}
/* «Добавить «Kelajak soati» во все классы»: 1 ч в план классов, где его нет (без учителя — назначит завуч). */
function addKelajakToPlans(){
  var sid = findOrCreateSubject("Час будущего"), n = 0;
  state.classes.forEach(function(c){
    if(c.isHomeschool) return;
    var plan = state.curriculum[c.id] = state.curriculum[c.id] || {};
    if(Object.keys(plan).some(function(k){ return isClassHourSubj(k) && plan[k].hours > 0; })) return;
    plan[sid] = { hours: 1, teacherId: null, blockSize: 1, syncWith: null };
    n++;
  });
  if(n) invalidateSchedule("plan");
  return n;
}

/* Ячейка класса по слоту общей оси (номер урока школы − 1); вне уроков класса — null. */
function schedCellAtSlot(cls, d, slot){
  var lp = slot - classPeriodInfo(cls).offset;
  return lp < 0 ? null : schedCell(cls.id, d, lp);
}
function cellLabel(cell){
  if(!cell || !cell.lessons || !cell.lessons.length) return "";
  return cell.lessons.map(function(lesson){
    var s = subjectName(lesson.subjectId)+" / "+teacherName(lesson.teacherId);
    if(lesson.roomId) s += " ["+roomName(lesson.roomId)+"]";
    return s;
  }).join("\n");
}
/* Ячейка сетки класса с проверкой границ: класс мог появиться или измениться после составления. */
function schedCell(classId, d, p){
  var g = state.schedule && state.schedule.byClass[classId];
  return (g && g[d] && g[d][p]) || null;
}
function buildWorkbook(){
  var wb = XLSX.utils.book_new();
  (function(){
    // сводный лист: день и урок × классы (для стенда и сверки)
    var cls = state.classes.filter(function(c){ return state.schedule.byClass[c.id]; });
    var nd = schoolDays(), maxP = totalSlotsPerDay();
    var aoaA = [[uzt("День"), uzt("Урок")].concat(cls.map(function(c){ return c.name; }))];
    for(var d=0; d<nd; d++){
      for(var p=0; p<maxP; p++){
        aoaA.push([p === 0 ? DAY_NAMES_6[d] : "", String(p+1)].concat(cls.map(function(c){
          var cell = d < classDays(c) ? schedCellAtSlot(c, d, p) : null;
          return cell && cell.lessons ? cell.lessons.map(function(l){ return subjectName(l.subjectId) + (l.roomId ? " ["+roomName(l.roomId)+"]" : ""); }).join("\n") : "";
        })));
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaA), uzt("Все классы"));
  })();
  var daysAll = DAY_NAMES_6;
  var usedNames = {}; usedNames[String(uzt("Все классы")).toLowerCase()] = true;
  // имена листов уникальны: одинаковые классы или ФИО, совпадающие в первых 31 символе, получают « (2)», « (3)»…
  function sheetName(name){
    var base = safeSheetName(name), n = base, k = 2;
    while(usedNames[n.toLowerCase()]){ var suf = " ("+k+")"; n = base.substring(0, 31 - suf.length).trim() + suf; k++; }
    usedNames[n.toLowerCase()] = true;
    return n;
  }
  state.classes.forEach(function(c){
    if(!state.schedule.byClass[c.id]) return; // класс без сетки — пропускаем
    var days = classDayNames(c);
    var pinfo = classPeriodInfo(c);
    var aoa = [];
    aoa.push([uzt("Урок")].concat(days));
    for(var p=0; p<pinfo.periodsPerDay; p++){
      var xlt = lessonTime(pinfo.offset+p+1);
      var row = [String(pinfo.offset+p+1) + (xlt ? " (" + xlt + ")" : "")];
      for(var d=0; d<days.length; d++){
        row.push(cellLabel(schedCell(c.id, d, p)));
      }
      aoa.push(row);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, sheetName(c.name));
  });

  var slots = totalSlotsPerDay();
  state.teachers.forEach(function(t){
    var aoa = [[uzt("Урок")].concat(daysAll)];
    for(var slot=0; slot<slots; slot++){
      var row = [slotLabel(slot) + (slotTime(slot) ? " (" + slotTime(slot) + ")" : "")];
      for(var d=0; d<daysAll.length; d++){
        var occ = "";
        state.classes.forEach(function(c){
          if(d >= classDays(c)) return;
          var pinfo2 = classPeriodInfo(c);
          var localP = slot - pinfo2.offset;
          if(localP < 0 || localP >= pinfo2.periodsPerDay) return;
          var cell = schedCell(c.id, d, localP);
          if(!cell || !cell.lessons) return;
          var lesson = cell.lessons.filter(function(l){ return l.teacherId === t.id; })[0];
          if(lesson) occ = c.name + " / " + subjectName(lesson.subjectId) + (lesson.roomId ? " ["+roomName(lesson.roomId)+"]" : "");
        });
        row.push(occ);
      }
      aoa.push(row);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, sheetName(uzt("Уч. ")+t.name));
  });

  if(state.rooms.length){
    var aoaR = [[uzt("Урок")].concat(daysAll)];
    for(var slot2=0; slot2<slots; slot2++){
      var rowR = [slotLabel(slot2)];
      for(var d2=0; d2<daysAll.length; d2++){
        var occR = [];
        state.classes.forEach(function(c){
          if(d2 >= classDays(c)) return;
          var pinfo3 = classPeriodInfo(c);
          var localP2 = slot2 - pinfo3.offset;
          if(localP2 < 0 || localP2 >= pinfo3.periodsPerDay) return;
          var cellR = schedCell(c.id, d2, localP2);
          if(!cellR || !cellR.lessons) return;
          cellR.lessons.forEach(function(lesson){
            if(lesson.roomId) occR.push(roomName(lesson.roomId)+": "+c.name+"/"+subjectName(lesson.subjectId));
          });
        });
        rowR.push(occR.join("; "));
      }
      aoaR.push(rowR);
    }
    var wsR = XLSX.utils.aoa_to_sheet(aoaR);
    XLSX.utils.book_append_sheet(wb, wsR, sheetName(uzt("Кабинеты")));
  }
  wb.SheetNames.forEach(function(n){ xlsxFitSheet(wb.Sheets[n]); });
  return wb;
}
/* Оформление листа Excel: ширина колонок по тексту (до 40 знаков), перенос строк, чтобы весь текст ячейки
   был виден, высота строк по числу строк текста, жирная первая строка, выравнивание по верху. */
function xlsxFitSheet(ws){
  if(!ws || !ws["!ref"]) return;
  var R = XLSX.utils.decode_range(ws["!ref"]), widths = [], MIN = 6, MAX = 40;
  for(var c=R.s.c; c<=R.e.c; c++){
    var w = MIN;
    for(var r=R.s.r; r<=R.e.r; r++){
      var cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
      if(cell && cell.v != null) String(cell.v).split("\n").forEach(function(line){ w = Math.max(w, line.length + 1); });
    }
    widths.push(Math.min(MAX, w));
  }
  ws["!cols"] = widths.map(function(w){ return { wch: w }; });
  var rows = [];
  for(var r2=R.s.r; r2<=R.e.r; r2++){
    var lines = 1;
    for(var c2=R.s.c; c2<=R.e.c; c2++){
      var cl = ws[XLSX.utils.encode_cell({ r: r2, c: c2 })];
      if(!cl || cl.v == null) continue;
      var n = 0, wch = widths[c2 - R.s.c];
      String(cl.v).split("\n").forEach(function(line){ n += Math.max(1, Math.ceil(line.length / Math.max(1, wch - 1))); });
      lines = Math.max(lines, n);
      cl.s = { alignment: { wrapText: true, vertical: "top" } };
      if(r2 === R.s.r) cl.s.font = { bold: true };
    }
    rows.push({ hpt: Math.max(15, 15 * lines) });
  }
  ws["!rows"] = rows;
}
function safeSheetName(name){
  // Excel не принимает \ / ? * [ ] : и апостроф в начале или конце имени листа
  var n = String(name).replace(/[\\\/\?\*\[\]:]/g, " ").replace(/^'+|'+$/g, "").trim();
  return n.substring(0,31).trim() || "Sheet";
}

          state = parsed.state; ensureParallels(state);

var dragSrc = null;
function dragCell(e){ return e.target && e.target.closest ? e.target.closest('td[data-drop="1"]') : null; }
function onCellDragStart(e){
  var td = dragCell(e);
  if(!td){ dragSrc = null; return; }
  dragSrc = { c: td.getAttribute("data-class"), d: parseInt(td.getAttribute("data-day"),10), p: parseInt(td.getAttribute("data-period"),10) };
  try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "cell"); }catch(x){}
}
function onCellDragOver(e){
  var td = dragCell(e);
  if(dragSrc && td && td.getAttribute("data-class") === dragSrc.c) e.preventDefault();
}
function onCellDrop(e){
  var td = dragCell(e);
  if(!dragSrc || !td || td.getAttribute("data-class") !== dragSrc.c) return;
  e.preventDefault();
  var g = state.schedule.byClass[dragSrc.c], cls = byId(state.classes, dragSrc.c);
  var d2 = parseInt(td.getAttribute("data-day"),10), p2 = parseInt(td.getAttribute("data-period"),10);
  if(d2 === dragSrc.d && p2 === dragSrc.p) return;
  var a = g[dragSrc.d][dragSrc.p], b = g[d2][p2];
  g[dragSrc.d][dragSrc.p] = b; g[d2][p2] = a;
  // у переставленных уроков — новые кабинеты на новом месте
  [[a, d2, p2], [b, dragSrc.d, dragSrc.p]].forEach(function(x){
    var cell = x[0]; if(!cell) return;
    cell.manual = true; cell.locked = false;
    cell.lessons = cell.lessons.map(function(l){ return { subjectId: l.subjectId, teacherId: l.teacherId, roomId: null }; });
    var rm = pickRoomsManual(cls, cell.lessons, x[1], x[2], scheduleOccupancy(dragSrc.c+"|"+x[1]+"|"+x[2])) || {};
    cell.lessons.forEach(function(l){ l.roomId = rm[l.subjectId] || null; });
  });
  dragSrc = null;
  render();
}
function onChange(e){

  else if(act==="cur-variant"){
    var cvC = t.getAttribute("data-class"), cvS = t.getAttribute("data-subj"), cvN = t.value;
    var planCv = state.curriculum[cvC];
    if(planCv && planCv[cvS] && cvN && cvN !== cvS && !planCv[cvN]){
      var moved = planCv[cvS];
      delete planCv[cvS];
      planCv[cvN] = moved;
      if(moved.syncWith && planCv[moved.syncWith]) planCv[moved.syncWith].syncWith = cvN;
      invalidateSchedule("plan");

  else if(act==="parallel-periods"){

    var ppg = parseInt(t.getAttribute("data-grade"),10);
    if(t.value === "byday"){
      var pd0 = []; for(var dd=0; dd<6; dd++) pd0.push(parallelPeriods(ppg));
      state.config.parallels[ppg].periodsByDay = pd0;
    } else { state.config.parallels[ppg].periods = parseInt(t.value,10) || 6; state.config.parallels[ppg].periodsByDay = null; }
    invalidateSchedule("regime"); render();
  }
  else if(act==="class-periods"){

    if(t.value === "byday"){ var cd0 = []; for(var cd=0; cd<6; cd++) cd0.push(classPeriodsOn(cP, cd) || classPeriods(cP)); cP.periodsByDay = cd0; }
    else { cP.periodsOverride = t.value ? parseInt(t.value,10) : null; cP.periodsByDay = null; }
    invalidateSchedule("regime"); render();
  }

  else if(act==="cur-blocksize"){

    var subjIdBs = t.getAttribute("data-subj");

    if(entryBs.syncWith && state.curriculum[classIdBs][entryBs.syncWith]) state.curriculum[classIdBs][entryBs.syncWith].blockSize = entryBs.blockSize;
    invalidateSchedule("plan"); render();
  }

    var planSw = state.curriculum[classIdSw];
    var entrySw = planSw[subjIdSw];

    if(oldPartner && planSw[oldPartner]) planSw[oldPartner].syncWith = null;
    var newPartner = t.value || null;
    if(newPartner && planSw[newPartner]){
      var newPartnerOld = planSw[newPartner].syncWith;

  }

  }

  else if(act==="cur-groupsize"){
    var gsC = t.getAttribute("data-class"), gsS = t.getAttribute("data-subj");

    if(gsE){ gsE.groupSize = t.value ? Math.max(1, parseInt(t.value,10)||1) : null; invalidateSchedule("room"); saveState(); }
  }
}

/* Выгрузка Excel: событие — по результату, при сбое — понятное сообщение, а не тишина (P0-3). */
function doExportXlsx(){
  if(!state.schedule) return;
  if(typeof XLSX === "undefined"){
    notify(uzt("Не удалось сформировать Excel: библиотека не загрузилась. Проверьте интернет и обновите страницу."), "warn");
    track("export_xlsx_result", { ok: false, reason: "no_library" });
    return;
  }
  var wb, arrayBuf;
  try{
    sanitizeSchedule();
    wb = buildWorkbook();
    arrayBuf = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  }catch(e){
    notify(uzt("Не удалось сформировать Excel. Скачайте настройки (.json) и передайте их в поддержку."), "warn");
    track("export_xlsx_result", { ok: false, reason: "build" });
    return;
  }
  offerDownload("raspisanie.xlsx", arrayBuf, function(ok){
    track("export_xlsx_result", { ok: ok, reason: ok ? "ok" : "download", sheets: wb.SheetNames.length });
    if(ok) milestone("exported");
  });
}

/* done(ok) — чем закончилось скачивание (необязательно). */
function offerDownload(filename, data, done){
  done = done || function(){};
  // вне claude.ai глобальной переменной claude нет вообще (не undefined-значение,
  // а неопределённая переменная) — обращение к ней без проверки роняет код синхронно,
  // до того как сработает .catch(); поэтому проверка typeof обязательна
  if(typeof claude === "undefined" || !claude || !claude.use){ done(fallbackDownload(filename, data)); return; }
  claude.use("downloads").then(function(downloads){
    if(!downloads){ done(fallbackDownload(filename, data)); return; }
    downloads.save({ filename: filename, data: data }).then(function(){ done(true); }, function(err){
      if(err && err.code === "unavailable") done(fallbackDownload(filename, data));
      else done(false);
    });
  }).catch(function(){ done(fallbackDownload(filename, data)); });
}
function fallbackDownload(filename, data){
  try{
    var blob = (data instanceof ArrayBuffer) ? new Blob([data]) : new Blob([data], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return true;
  }catch(e){ alert(uzt("Скачивание недоступно в этом окне просмотра.")); return false; }
}

/* ================= SUBJECT VARIANTS ================= */
var VARIANT_SUFFIXES = [" по выбору", " вариатив", " Экономика", " Жасорат"];
function baseSubjectName(name){
  name = String(name);
  for(var i=0; i<VARIANT_SUFFIXES.length; i++){
    var s = VARIANT_SUFFIXES[i];
    if(name.length > s.length && name.slice(-s.length) === s) return name.slice(0, -s.length);
  }
  return name;
}
function subjectVariants(subjId){
  var base = baseSubjectName(subjectRawName(subjId));
  var names = [base].concat(VARIANT_SUFFIXES.map(function(s){ return base+s; }));
  var out = [];
  names.forEach(function(n){ var s = state.subjects.filter(function(x){ return x.name===n; })[0]; if(s) out.push(s); });
  return out;
}
/* Группа предмета — для цвета в сетке. Определяется по русскому названию без варианта
   («по выбору», «вариатив», «Жасорат»…), группы «(группа 2)» и «как второй иностранный язык». */
var SUBJECT_GROUPS = [
  ["pe", /физическ|военн|гимнаст/i],
  ["lang", /язык|литератур|чтение|речи|почерк|выразительн|текстолог|ораторск|выступлен/i],
  ["math", /математ|алгебр|геометр|информатик|робототех/i],
  ["science", /физик|хими|биолог|естествозн|географ|астроном|наука/i],
  ["social", /истори|права|воспитани|экономик|предпринимат|час будущего/i],
  ["arts", /музык|изобразит|искусств|черчени|рисовани/i],
  ["tech", /технолог|профессион/i]
];
var SUBJECT_GROUP_LABELS = [
  ["lang", "Языки и литература"], ["math", "Математика и информатика"], ["science", "Естественные науки"],
  ["social", "История и общество"], ["arts", "Искусство и черчение"], ["pe", "Физкультура и военная подготовка"], ["tech", "Технология и профессия"]
];
function subjectGroup(subjId){
  var n = baseSubjectName(subjectRawName(subjId)).replace(/ \(группа \d+\)$/, "").replace(/ как второй иностранный язык$/, "");
  for(var i=0; i<SUBJECT_GROUPS.length; i++){ if(SUBJECT_GROUPS[i][1].test(n)) return SUBJECT_GROUPS[i][0]; }
  return "";
}
function cellGroupClass(lessons){
  // групповой урок из разных групп (редко) — по первому предмету
  var g = lessons && lessons.length ? subjectGroup(lessons[0].subjectId) : "";
  return g ? " cat-" + g : "";
}
function subjectDot(subjId){ var g = subjectGroup(subjId); return '<span class="subj-dot'+(g?' cat-'+g:'')+'" aria-hidden="true"></span>'; }
function subjectLegendHtml(){
  return '<div class="subj-legend" aria-label="'+escAttr(uzt("Цвета групп предметов"))+'">'+SUBJECT_GROUP_LABELS.map(function(x){
    return '<span><span class="subj-dot cat-'+x[0]+'" aria-hidden="true"></span>'+escHtml(uzt(x[1]))+'</span>';
  }).join("")+'</div>';
}
function subjectCellHtml(classId, subjId){
  var vars = subjectVariants(subjId);
  if(vars.length < 2) return escHtml(subjectName(subjId));
  var h = '<select class="variant-select" data-act="cur-variant" data-class="'+classId+'" data-subj="'+subjId+uzt('" title="Вариант предмета">');
  vars.forEach(function(v){ h += '<option value="'+v.id+'"'+(v.id===subjId?" selected":"")+'>'+escHtml(subjDisplay(v))+'</option>'; });
  return h+'</select>';
}

/* ================= БЫСТРАЯ НАСТРОЙКА (P1-2) =================
   Пять экранов-анкет над мастером: школа и классы → режим → учителя → план → составить (+ итог).
   Пишет в те же данные, что и мастер. Шаг запоминается в браузере: после перезагрузки бот
   предлагает продолжить с того же места. Повторный проход не удаляет классы с правками без вопроса. */
var BOT_STEPS = [["school", "Школа"], ["mode", "Режим"], ["staff", "Учителя"], ["plan", "План"], ["gen", "Составить"]];
/* Пилот (v0.10): первый вопрос бота — «Расписание уже есть в eMaktab?». path = import — загрузка и проверка
   (основной путь), scratch — прежние 5 экранов «с нуля», null — вопрос ещё не задан. */
var BOT_IMPORT_STEPS = [["emk", "Загрузка"], ["check", "Проверка"]];
var bot = { open: true, step: 0, path: null, draft: null, resume: false, startTracked: false, planFilled: null };
function botSteps(){ return bot.path === "import" ? BOT_IMPORT_STEPS : BOT_STEPS; }
/* Шаг, на котором путь пройден: итог «с нуля» — 5, проверка после загрузки — 1. */
function botDoneStep(){ return bot.path === "import" ? 1 : 5; }
(function loadBot(){
  try{
    var saved = JSON.parse(localStorage.getItem("tt_bot") || "null");
    if(saved){
      bot.path = saved.path === "import" || saved.path === "scratch" ? saved.path : (saved.step ? "scratch" : null);
      bot.step = Math.max(0, Math.min(botDoneStep(), saved.step || 0));
      bot.open = saved.open !== false;
      bot.resume = bot.open && !!bot.path && bot.step > 0 && bot.step < botDoneStep();
      if(bot.path && bot.step >= botDoneStep()) bot.open = false; // настройка пройдена — после перезагрузки бот свёрнут в полосу
    } else if(localStorage.getItem("tt_bot_collapsed") === "1") bot.open = false;
  }catch(e){}
})();
function botSave(){ try{ localStorage.setItem("tt_bot", JSON.stringify({ step: bot.step, open: bot.open, path: bot.path })); }catch(e){} }
function botInitDraft(){
  var counts = {}, langs = {};
  for(var g=1; g<=11; g++) counts[g] = state.classes.filter(function(c){ return c.grade === g && !c.isHomeschool; }).length;
  state.classes.forEach(function(c){ langs[c.instructionLang] = (langs[c.instructionLang] || 0) + 1; });
  var lang = Object.keys(langs).sort(function(a,b){ return langs[b] - langs[a]; })[0] || "uz";
  ensureParallels(state);
  var P = state.config.parallels;
  bot.draft = { type: state.config.schoolType, lang: lang, counts: counts,
    mode: { j: { days: P[1].days, start: P[1].start || 1, per: P[1].periods }, s: { days: P[5].days, start: P[5].start || 1, per: P[5].periods } } };
}
function botStepLabel(i){ var S = botSteps(); return uzt(S[Math.min(i, S.length - 1)][1]); }

/* Есть ли у класса правки, которые жалко потерять: назначенные учителя, план, собранный вручную, закрепления и ручные правки в сетке. */
function classHasEdits(c){
  var plan = state.curriculum[c.id] || {}, keys = Object.keys(plan);
  if(keys.some(function(k){ return !!plan[k].teacherId; })) return true;
  if(keys.length && !c.appliedPlan) return true;
  var g = state.schedule && state.schedule.byClass[c.id];
  return !!(g && g.some(function(day){ return day.some(function(cell){ return cell && (cell.locked || cell.manual); }); }));
}
/* Довести число обычных классов параллели до n: новые — со следующей буквой алфавита языка, лишние — с конца. */
function syncGradeCount(g, n, lang){
  var list = state.classes.filter(function(c){ return c.grade===g && !c.isHomeschool; }).sort(compareClasses);
  while(list.length < n){ var c = newClassObj(g, nextLetterFor(g, lang), lang); state.classes.push(c); list.push(c); }
  if(list.length > n){
    var drop = {};
    list.slice(n).forEach(function(c){ drop[c.id] = true; delete state.curriculum[c.id]; });
    state.classes = state.classes.filter(function(c){ return !drop[c.id]; });
  }
}
function setParallels(from, to, field, v){
  ensureParallels(state);
  for(var g=from; g<=to; g++){ state.config.parallels[g][field] = v; }
}
function botApplySchool(){
  var d = bot.draft, before = dataSnapshot();
  state.config.schoolType = d.type;
  for(var g=1; g<=11; g++) syncGradeCount(g, d.counts[g], d.lang);
  if(dataSnapshot() !== before) invalidateSchedule("bot");
  milestone("classes_configured");
}
function botApplyMode(){
  var m = bot.draft.mode, before = dataSnapshot();
  [["j", 1, 4], ["s", 5, 11]].forEach(function(r){
    setParallels(r[1], r[2], "days", m[r[0]].days);
    setParallels(r[1], r[2], "start", m[r[0]].start);
    for(var gg=r[1]; gg<=r[2]; gg++){ if(state.config.parallels[gg].periods !== m[r[0]].per) state.config.parallels[gg].periodsByDay = null; }
    setParallels(r[1], r[2], "periods", m[r[0]].per);
  });
  if(dataSnapshot() !== before) invalidateSchedule("bot");
}
/* План заполняется только у пустых классов 1–11 (кроме ДО): то, что меняли вручную, не трогаем. */
function botFillPlans(){
  var n = 0;
  state.classes.forEach(function(c){
    if(!(c.grade >= 1) || c.isHomeschool || computeUnits(c.id).length) return;
    c.officialPlanApplied = false;
    autofillCurriculum(c.id);
    if(computeUnits(c.id).length) n++;
  });
  bot.planFilled = n;
}
function dataSnapshot(){ var sc = state.schedule; state.schedule = null; var s = JSON.stringify(state); state.schedule = sc; return s; }

function botGoStep(i){
  bot.step = i;
  if(i === 3) botFillPlans();
  botSave();
}
/* «Дальше»: применить текущий экран и перейти к следующему. */
function botNext(){
  var st = bot.step;
  track("bot_step", { step: BOT_STEPS[Math.min(st, 4)][0] });
  if(st === 0){
    // классы с правками, которые пропадут при уменьшении числа классов, — только с подтверждением
    var d = bot.draft, victims = [];
    for(var g=1; g<=11; g++){
      var list = state.classes.filter(function(c){ return c.grade===g && !c.isHomeschool; }).sort(compareClasses);
      list.slice(d.counts[g]).forEach(function(c){ if(classHasEdits(c)) victims.push(c); });
    }
    if(victims.length){
      showDialog(uzt("Удалить классы с правками?"),
        uzt("Классов стало меньше. Будут удалены классы, у которых есть ваши правки (учителя, план, закреплённые уроки): ")+victims.map(function(c){ return c.name; }).join(", ")+".",
        [["keep", uzt("Оставить эти классы"), "btn-primary"], ["del", uzt("Удалить")]],
        function(v){
          if(v !== "del") victims.forEach(function(c){ d.counts[c.grade] = Math.max(d.counts[c.grade], state.classes.filter(function(x){ return x.grade===c.grade && !x.isHomeschool; }).length); });
          botApplySchool(); botGoStep(1); render();
        });
      return;
    }
    botApplySchool();
  } else if(st === 1){
    botApplyMode();
  } else if(st === 2){
    if(importPreview && importPreview.via === "bot") importPreview = null;
  }
  botGoStep(Math.min(st + 1, 5));
  render();
}
function botRestart(){
  bot.step = 0; bot.path = null; bot.draft = null; bot.open = true; bot.resume = false; bot.planFilled = null;
  focusDismissed = false; try{ localStorage.removeItem("tt_focus_off"); }catch(e){}
  if(importPreview && importPreview.via === "bot") importPreview = null;
  botSave();
  track("bot_start", { first: false });
}
function botGenerate(){
  requestGenerate("bot", function(ok){
    if(ok){ bot.step = 5; botSave(); setTab("schedule", "bot"); }
    render();
  });
}
