<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип 0.12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Прототип 0.12: стиль Б «мягкие карточки», окно — Б1, правки П-1…П-9 (решения 2026-09-29). Данные вымышленные. */
:root{
  --ink:#1B2B4B; --ink-soft:#6E7F99; --border:#E1E8F1; --border-strong:#D3DDEA;
  --accent:#2F7EEA; --accent-soft:#E4EFFD; --panel:#EEF4FB; --page:#F4F7FB;
  --ok:#2E9E5B; --ok-bg:#E3F5EA; --warn:#B5530F; --warn-bg:#FDEBDD; --alarm:#E8590C; --danger:#E5484D; --danger-bg:#FDECEC;
  --c-lang-bg:#E7EEFD; --c-lang:#2F6FDE; --c-math-bg:#FDEBDD; --c-math:#C8611A; --c-science-bg:#E1F4EA; --c-science:#23905A;
  --c-social-bg:#F1E8F8; --c-social:#8A55B8; --c-arts-bg:#FCF1D6; --c-arts:#B3830A; --c-pe-bg:#DDF1F5; --c-pe:#1B879C;
  --c-tech-bg:#EFEDE8; --c-tech:#7A7465;
  --shadow:0 1px 2px rgba(16,35,63,.05),0 4px 14px rgba(16,35,63,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
[data-go],[data-act],[data-bot],[data-kon],[data-issue]{cursor:pointer}

/* панель прототипа (не часть продукта) */
.proto{display:flex;align-items:center;gap:10px;padding:6px 16px;background:#F1E8F8;color:#5B3A7A;font-size:12.5px;flex-wrap:wrap;border-bottom:1px solid #E2D2F0}
.proto b{font-weight:700}
.proto select{font:inherit;font-size:12.5px;padding:3px 8px;border-radius:8px;border:1px solid #D9C6EA;max-width:340px;background:#fff}
.proto label{display:flex;align-items:center;gap:6px;cursor:pointer}
.proto .sp{flex:1}

/* шапка — тёмно-синяя (П-8) */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#1B2B4B;color:#fff;position:relative}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.logo i{font-size:20px;color:#9CC3FF}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;margin-left:12px}
.seg span{padding:5px 14px;font-weight:600;font-size:13px;color:rgba(255,255,255,.75);border-radius:8px}
.seg .on{background:#fff;color:var(--accent)}
.sp{flex:1}
.chip{padding:6px 10px;border-radius:10px;font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1);white-space:nowrap}
.menu{position:absolute;right:16px;top:48px;z-index:30;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 28px rgba(16,35,63,.18);padding:6px;width:260px}
.menu div{padding:9px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:13.5px}
.menu div:hover{background:#F4F7FB}
.menu .danger{color:var(--danger)}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 0}

/* каркас конструктора */
.body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;padding:14px;min-height:calc(100vh - 90px)}
.body.withpanel{grid-template-columns:220px minmax(0,1fr) 340px}
.side,.main,.panel{background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.side{padding:12px 10px;align-self:start;position:sticky;top:14px}
.grp{font-size:11px;font-weight:700;letter-spacing:.04em;color:#9AA8BC;margin:14px 8px 6px;text-transform:uppercase}
.grp:first-child{margin-top:4px}
.nav{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;font-weight:500;font-size:13.5px;margin-bottom:2px}
.nav:hover{background:#F7F9FC}
.nav i{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:#F1F4F8;color:var(--ink-soft);flex:none}
.nav .n{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.nav .b{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.b.w{background:var(--warn-bg);color:var(--warn)} .b.ok{background:var(--ok-bg);color:var(--ok)}
.nav.on{box-shadow:0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600;background:#fff}
.nav.on i{background:var(--accent);color:#fff}
.side .sep{border-top:1px solid var(--border);margin:12px 4px 8px}
.main{padding:18px 22px 18px;min-width:0;display:flex;flex-direction:column}
.content{flex:1}
.ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h3{margin:0;font-size:20px;font-weight:700}
.ph p{margin:3px 0 0;color:var(--ink-soft);font-size:13px;max-width:640px}

/* прогресс — вариант В (П-7): шаги над заголовком экрана, «Назад / Дальше» внизу */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--ink-soft);font-weight:600}
.segbar{display:flex;gap:4px}
.segbar span{width:26px;height:5px;border-radius:999px;background:#E3E9F1}
.segbar .d{background:var(--ok)} .segbar .w{background:#F2B38A} .segbar .c{background:var(--accent)}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:12px;margin-top:20px}
.fnote{font-size:12.5px;color:var(--ink-soft)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border-strong);background:#fff;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{background:#F7F9FC}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#2A70D2}
.btn.big{padding:11px 18px;font-size:14px}
.btn.dng{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn i{font-size:16px}
.link{color:var(--accent);font-weight:600;font-size:13px}
.muted{color:var(--ink-soft)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:10px;padding:7px 11px;color:var(--ink-soft);font-size:13px;min-width:240px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{border-radius:12px;padding:10px 12px;background:#F7F9FC;display:flex;gap:10px;align-items:center}
.tile .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.tile .v{font-size:20px;font-weight:700;line-height:1.1}
.tile .l{font-size:12px;color:var(--ink-soft)}
.t-ok .ic{background:var(--ok-bg);color:var(--ok)} .t-w .ic{background:var(--warn-bg);color:var(--warn)} .t-w .v{color:var(--warn)}
.t-i .ic{background:var(--accent-soft);color:var(--accent)}
.card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h4{margin:0 0 4px;font-size:15px}
.card .hint{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{display:flex;gap:10px;align-items:flex-start;background:#F7F1FC;border:1px dashed #D9C6EA;color:#5B3A7A;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
.note i{font-size:16px;margin-top:1px}
.note .st2{background:#8A55B8;color:#fff;border-radius:6px;padding:0 6px;font-weight:700;font-size:11px;margin-right:4px}
.hideNotes .note{display:none}
.st2b{display:inline-block;background:#F1E8F8;color:#8A55B8;border-radius:6px;padding:1px 6px;font-weight:700;font-size:10.5px;margin-left:6px;vertical-align:1px}
.hideNotes .st2b{display:none}

/* таблицы */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{white-space:nowrap;font-size:12px;color:var(--ink-soft);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.tbl tr.row:hover td{background:#F7F9FC}
.tbl tr.par td{background:#F7F9FC;font-weight:600}
.tbl tr.sel td{background:var(--accent-soft)}
.inh{color:#9AA8BC}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#F1F4F8;color:var(--ink-soft);white-space:nowrap}
.tag.diff{background:#FFF4E5;color:#9A3412} .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.w{background:var(--warn-bg);color:var(--warn)}
.tag.i{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.caret{color:var(--ink-soft);margin-right:6px}

/* боковая панель */
.panel{padding:18px 18px 20px;align-self:start;position:sticky;top:14px}
.panel h4{margin:0;font-size:17px}
.panel .ph2{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.inp{border:1px solid var(--border-strong);border-radius:10px;padding:8px 11px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp.inh{color:var(--ink-soft);background:#F7F9FC;border-style:dashed}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs span{padding:6px 11px;border-radius:9px;border:1px solid var(--border-strong);font-size:13px;font-weight:600}
.segs .on{background:var(--accent);border-color:var(--accent);color:#fff}
.pfoot{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);align-items:center}
.avail{display:grid;grid-template-columns:24px repeat(6,1fr);gap:3px;font-size:11px;text-align:center}
.avail .h{color:var(--ink-soft);font-weight:600}
.avail .c{height:22px;border-radius:5px;background:#D9F2E3}
.avail .c.off{background:#FDECEC;background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(229,72,77,.18) 4px 8px)}

/* сетка Б1 */
.cls{padding:5px 11px;border-radius:9px;border:1px solid var(--border);font-weight:600;font-size:13px;background:#fff}
.cls.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-weight:600;font-size:12.5px}
.pill.w{background:var(--warn-bg);color:var(--warn)} .pill.r{background:var(--danger-bg);color:#B42318} .pill.i{background:var(--accent-soft);color:var(--accent)}
table.g{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.g th{font-size:12px;color:var(--ink-soft);font-weight:600;text-align:left;padding:6px 8px}
.g th.n{width:34px}
.g td{padding:3px;vertical-align:top}
.g td.n{text-align:center;color:var(--ink-soft);font-weight:600;font-size:12px;vertical-align:middle}
.cell{border-radius:9px;padding:6px 8px;min-height:48px;background:color-mix(in srgb,var(--gbg) 60%,#fff);position:relative}
.cell .s{font-weight:600;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t{font-size:11.5px;color:var(--grp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s i{font-size:12px;color:var(--ink-soft);margin-left:3px}
.cell.gap{background:#fff;border:2px solid var(--alarm);color:var(--alarm);box-shadow:0 0 0 4px #FFE8D9;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:12.5px}
.cell.cf{background:var(--danger-bg);border:2px solid var(--danger);color:#B42318;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:12.5px}
.cell.sel{box-shadow:0 0 0 2.5px var(--accent)}
.cell.chg::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.gwrap{position:relative}
.pop{position:absolute;z-index:5;width:250px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(16,35,63,.18);padding:12px 14px;font-size:13px}
.pop b{display:block;margin-bottom:2px}
.pop .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)}
.pop .row span:first-child{color:var(--ink-soft)}
.pop .row.hl{background:#FFF7F1;margin:0 -14px;padding:6px 14px}
.dd{position:relative;display:inline-block}
.ddm{position:absolute;right:0;top:40px;z-index:6;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(16,35,63,.18);padding:6px;width:330px}
.ddm div{padding:10px;border-radius:8px}
.ddm div:hover{background:#F4F7FB}
.ddm b{display:block;font-size:13.5px}
.ddm span{font-size:12.5px;color:var(--ink-soft)}
.tt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
.tt th{color:var(--ink-soft);font-weight:600;text-align:left;padding:6px}
.tt td{padding:3px}
.tt tr.hl td{background:var(--accent-soft)}
.tt tr.hl td:first-child{border-radius:9px 0 0 9px} .tt tr.hl td:last-child{border-radius:0 9px 9px 0}
.tt .x{border-radius:7px;padding:5px 7px;background:#F1F4F8;font-weight:600;min-height:28px}
.tt .x.e{background:transparent}
.tt .x.g{background:#fff;border:2px solid var(--alarm);color:var(--alarm);text-align:center}
.tt .x.cf{background:var(--danger-bg);border:2px solid var(--danger);color:#B42318}

/* полоска «Проблема N из M» (П-4) */
.istrip{display:flex;align-items:center;gap:10px;background:#FFF7F1;border:1px solid #F6C9A6;border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:13px;flex-wrap:wrap}
.istrip b{color:var(--warn)}
.istrip .t{font-weight:600}

/* пустая сетка (П-5) */
.ready{list-style:none;margin:0 0 18px;padding:0;max-width:520px}
.ready li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.ready li i{font-size:18px}
.ready li .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:12.5px}

/* модальное окно */
.shade{position:fixed;inset:0;background:rgba(27,43,75,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(16,35,63,.25);width:560px;max-width:100%;padding:22px 24px}
.modal h4{margin:0 0 4px;font-size:19px}
.modal .lead{margin:0 0 16px;color:var(--ink-soft);font-size:13.5px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.cmp div{background:#F7F9FC;border-radius:12px;padding:10px 12px}
.cmp span{display:block;font-size:12px;color:var(--ink-soft)}
.cmp b{font-size:18px}
.cmp s{color:var(--ink-soft);font-weight:500;margin-right:6px}
.cmp .good b{color:var(--ok)} .cmp .w b{color:var(--warn)}
.macts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* помощник */
.botwrap{padding:26px 16px 48px;display:flex;justify-content:center}
.bot{width:100%;max-width:800px}
/* шаги — линия и галочки, как в 0.11 (П-6) */
.track{display:flex;align-items:flex-start;margin:0 auto 20px;max-width:620px}
.tstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-align:center}
.tstep .c{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;z-index:1;font-size:13px}
.tstep::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--border)}
.tstep:first-child::before{display:none}
.tstep.done{color:var(--ok)} .tstep.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.tstep.on{color:var(--accent)} .tstep.on .c{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tstep.done::before,.tstep.on::before{background:var(--ok)}
.bcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:24px 26px}
.bcard h4{margin:0 0 4px;font-size:22px}
.bcard .lead{margin:0 0 18px;color:var(--ink-soft)}
.bfoot{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
.opt div{border:1.5px solid var(--border);border-radius:14px;padding:16px}
.opt div:hover{border-color:var(--accent);background:#FAFCFF}
.opt i{font-size:26px;color:var(--accent)}
.opt b{display:block;font-size:16px;margin:8px 0 4px}
.opt span{font-size:13px;color:var(--ink-soft)}
.drop{border:2px dashed var(--border-strong);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:10px}
.drop i{font-size:28px;color:var(--accent)}
.drop b{display:block}
.drop span{font-size:12.5px;color:var(--ink-soft)}
.drop.done{border-style:solid;border-color:#BFE6CD;background:#F4FBF7}
.drop.done i{color:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi div{border-radius:12px;padding:12px 14px;background:#F7F9FC}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:var(--ink-soft)}
.kpi .w b{color:var(--warn)} .kpi .g b{color:var(--ok)}
.probh{font-size:13px;font-weight:700;margin:0 0 6px}
.prob{list-style:none;margin:0 0 6px;padding:0}
.prob li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px}
.prob li>i{color:var(--warn);font-size:18px}
.prob li .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}
/* «О школе» — вопросы списком, как карточка «Правила школы» 0.11 (П-2) */
.qsec{font-size:12px;font-weight:700;color:#9AA8BC;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 4px}
.qsec:first-child{margin-top:0}
.qrow{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.qrow .qt{flex:1}
.qrow b{display:block;font-size:14px}
.qrow span.h{font-size:12.5px;color:var(--ink-soft)}
.yn2{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;flex:none}
.yn2 span{padding:6px 14px;font-weight:600;font-size:13px}
.yn2 span+span{border-left:1px solid var(--border-strong)}
.yn2 .on{background:var(--accent);color:#fff}
.sub{margin:10px 0 0;padding:10px 12px;background:#F7F9FC;border-radius:10px;font-size:12.5px}
.sub .cl{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sub .cl span{padding:4px 10px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font-weight:600}
.sub .cl span.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dirl{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;margin-top:8px}
.dirl .inp{padding:5px 10px;font-size:13px;background:#fff}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}

function fresh(){ return { mode:"bot", bot:"start", scr:"grid", cls:"7-A", par:"7", openPar:"7", panel:null, by:false, hlT:null, hl:null, popKind:null, improved:false, showChg:false,

function yn(key, val){ return '<span class="yn2"><span class="'+(val==="yes"?"on":"")+'" data-act="yn" data-k="'+key+'" data-v="yes">Да</span><span class="'+(val==="no"?"on":"")+'" data-act="yn" data-k="'+key+'" data-v="no">Нет</span></span>'; }
function stepState(k){
  if(st.empty) return "todo";

  if(k === "grid") return st.hasSchedule ? "done" : "todo";
  if(k === "check") return !st.hasSchedule ? "todo" : (st.improved ? "done" : "warn");
  if(k === "transfer") return st.improved ? (Object.keys(st.done).length >= 12 ? "done" : "todo") : "todo";
  return "done";
}

    + '<div class="card"><h4><i class="ti ti-printer" style="color:var(--accent)"></i> Печать класса</h4><p class="hint">Лист А4 для стенда и дневника.</p><span class="btn">Выбрать класс</span></div>'
    + '<div class="card"><h4><i class="ti ti-user" style="color:var(--accent)"></i> Печать учителя</h4><p class="hint">Личное расписание учителя с кабинетами и временем.</p><span class="btn">Выбрать учителя</span></div>'
    + '<div class="card"><h4><i class="ti ti-layout-grid" style="color:var(--accent)"></i> Шахматка всех классов</h4><p class="hint">Все классы на одном листе — для завуча.</p><span class="btn">Печатать</span></div></div>';
};
K.upload = function(){
  return note("Загрузка из eMaktab — одно место в конструкторе. Повторная загрузка спрашивает, что сделать с правками.")
    + '<div class="ph"><div><h3>Загрузить из eMaktab</h3><p>Классы, учителя, кабинеты, нагрузка и расписание — из двух выгрузок eMaktab.</p></div></div>'
    + '<div class="drop done"><i class="ti ti-circle-check"></i><div><b>Загружено 29 сентября</b><span>grid.xls · неделя 14–20 сентября · 1 731 урок · load.xls · 900 строк</span></div><div class="sp"></div><span class="btn">Загрузить заново</span></div>'
    + '<div class="card"><h4>Загрузить заново — что будет с вашими правками</h4><p class="hint" style="margin:0">Спрошу перед загрузкой: оставить ваши правки в сетке или заменить всё тем, что сейчас в eMaktab. Список изменений для переноса пересчитается.</p></div>';
};

/* ================= РЕНДЕР ================= */
function modal(){
  if(st.modal === "improve") return '<div class="shade"><div class="modal"><h4>Расписание улучшено</h4><p class="lead">Уроки остались на местах везде, где им ничего не мешало. Закреплённые уроки не тронуты.</p>'
    + '<div class="cmp"><div class="good"><span>Окна у классов</span><b><s>49</s>8</b></div><div class="good"><span>Накладки учителей</span><b><s>1</s>0</b></div><div class="good"><span>Кабинеты дважды</span><b><s>2</s>0</b></div></div>'
    + '<div class="card" style="background:#F7F9FC;border:none"><h4 style="font-size:14px">В eMaktab поменять 41 ячейку в 12 классах</h4><p class="hint" style="margin:0">Больше всего — в 5-G и 8-E. Список по классам — в «Переносе в eMaktab».</p></div>'
    + '<div class="macts"><span class="btn pri" data-act="mGrid"><i class="ti ti-eye"></i>Показать изменения</span><span class="btn" data-act="mTransfer"><i class="ti ti-arrow-back-up"></i>Перенести в eMaktab</span><div class="sp"></div><span class="link" data-act="undo">Отменить</span></div></div></div>';
  if(st.modal === "built") return '<div class="shade"><div class="modal"><h4>Расписание составлено</h4><p class="lead">1 612 уроков за 25 секунд. Правила школы и методические дни учтены.</p>'
    + '<div class="cmp"><div class="good"><span>Накладки учителей</span><b>0</b></div><div class="w"><span>Окна у классов</span><b>3</b></div><div class="w"><span>Не размещено</span><b>14</b></div></div>'
    + '<div class="macts"><span class="btn pri" data-act="mBuilt"><i class="ti ti-table"></i>Открыть сетку</span><span class="btn" data-go="check">Что поправить</span></div></div></div>';
  return "";
}
function render(){
  document.body.classList.toggle("hideNotes", !st.notes);
  var h = topbar();
  if(st.mode === "bot"){
    h += '<div class="botwrap"><div class="bot">'+botSteps()+botBody()+'</div></div>';
  } else {
    var withPanel = st.panel && (st.scr === "classes" || st.scr === "teachers");
    h += '<div class="body'+(withPanel?" withpanel":"")+'">'+side()+'<div class="main"><div class="content">'+crumb()+K[st.scr]()+'</div>'+footNav()+'</div>'
      + (withPanel ? (st.scr === "classes" ? classPanel(st.panel) : teacherPanel(st.panel)) : '') + '</div>';
  }
  h += modal();
  document.getElementById("root").innerHTML = h;
  syncJump();
}

/* ================= НАВИГАЦИЯ ПРОТОТИПА ================= */
var JUMPS = [["bot:start","Помощник · Старт"],["bot:i1","Помощник · Проверить: загрузка"],["bot:i2","Помощник · Проверить: О школе"],["bot:i3","Помощник · Проверить: результат"],
  ["bot:s1","Помощник · С нуля: школа и классы"],["bot:s2","Помощник · С нуля: О школе"],["bot:s3","Помощник · С нуля: учителя"],["bot:s4","Помощник · С нуля: план"],["bot:s5","Помощник · С нуля: составляю"],["bot:s6","Помощник · С нуля: результат"],
  ["kon:school","Конструктор · Школа и правила"],["kon:classes","Конструктор · Классы"],["kon:empty","Конструктор · Классы — пустая школа"],["kon:teachers","Конструктор · Учителя"],["kon:subjects","Конструктор · Предметы"],["kon:rooms","Конструктор · Кабинеты"],
  ["kon:load","Конструктор · Нагрузка"],["kon:nosched","Конструктор · Сетка — расписания ещё нет"],["kon:grid","Конструктор · Сетка"],["kon:check","Конструктор · Проверка"],["kon:issue","Конструктор · Проверка → «Показать» (кабинет)"],
  ["kon:improve","Конструктор · Сетка — после «Улучшить» (этап 2)"],["kon:transfer","Конструктор · Перенос в eMaktab"],["kon:print","Конструктор · Печать и Excel"],["kon:upload","Конструктор · Загрузить из eMaktab"]];
var sel = document.getElementById("jump");
sel.innerHTML = JUMPS.map(function(j){ return '<option value="'+j[0]+'">'+j[1]+'</option>'; }).join("");
function syncJump(){
  var v = st.mode === "bot" ? "bot:"+st.bot : (st.empty ? "kon:empty" : (st.scr === "grid" && !st.hasSchedule ? "kon:nosched" : (st.scr === "grid" && st.improved ? "kon:improve" : (st.issue === 4 ? "kon:issue" : "kon:"+st.scr))));
  if(JUMPS.some(function(j){ return j[0] === v; })) sel.value = v;
}
function jump(v){
  var p = v.split(":"), notes = st.notes; st = fresh(); st.notes = notes;
  if(p[0] === "bot"){ st.mode = "bot"; st.bot = p[1]; if(p[1] !== "i1" && p[1] !== "start") st.uploaded = true; }
  else {
    st.mode = "kon";
    if(p[1] === "empty"){ st.scr = "classes"; st.empty = true; }
    else if(p[1] === "nosched"){ st.scr = "grid"; st.hasSchedule = false; }
    else if(p[1] === "improve"){ st.scr = "grid"; st.improved = true; st.showChg = true; }
    else if(p[1] === "issue"){ goIssue(4); }
    else { st.scr = p[1]; if(p[1] === "classes"){ st.openPar = "6"; st.panel = "6-V"; } if(p[1] === "teachers") st.panel = "Мирзаев О."; }
  }
  render(); window.scrollTo(0, 0);
}
sel.addEventListener("change", function(){ jump(sel.value); });
document.getElementById("notes").addEventListener("change", function(e){ st.notes = e.target.checked; render(); });

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-go],[data-act],[data-bot],[data-kon],[data-issue]");
  if(!el || el.closest(".proto") && !el.hasAttribute("data-act")) { if(st.menu || st.dd){ st.menu = false; st.dd = false; render(); } return; }
  var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  if(el.hasAttribute("data-issue")){ goIssue(+el.getAttribute("data-issue")); render(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-bot")){ st.bot = el.getAttribute("data-bot"); if(st.bot === "s6") st.hasSchedule = true; render(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-kon")){ st.mode = "kon"; st.scr = el.getAttribute("data-kon"); st.panel = null; st.empty = false; st.issue = null; st.hl = null; st.popKind = null; st.by = false; render(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-go")){ st.scr = el.getAttribute("data-go"); st.modal = null; st.panel = null; st.dd = false; st.empty = false; st.issue = null; st.hl = null; st.popKind = null; st.by = false; st.hlS = null; render(); window.scrollTo(0,0); return; }
  if(a !== "menu") st.menu = false;
  if(a !== "dd") st.dd = false;
  switch(a){
    case "mode": st.mode = v; break;
    case "menu": st.menu = !st.menu; break;
    case "wipe": st.mode = "kon"; st.empty = true; st.scr = "classes"; st.hasSchedule = false; break;
    case "unempty": st.empty = false; break;
    case "reset": st = fresh(); break;
    case "upload": st.uploaded = true; break;
    case "yn":
      var k = el.getAttribute("data-k");
      if(k[0] === "r") st.ans[+k.slice(1)] = v; else if(k === "jas") st.jas = v; else if(k === "dirYes") st.dirYes = v; else if(k[0] === "d") st.dirAns[+k.slice(1)] = v;
      break;
    case "jasCls": if(st.jasCls[v]) delete st.jasCls[v]; else st.jasCls[v] = 1; break;
    case "par": if(st.scr === "classes") st.openPar = st.openPar === v ? "" : v; else st.par = v; break;
    case "panel": st.panel = st.panel === v ? null : v; break;
    case "close": st.panel = null; break;
    case "toggleRule": var i = +el.getAttribute("data-i"); st.ans[i] = st.ans[i] === "no" ? "yes" : "no"; break;
    case "by": st.by = !st.by; st.issue = null; st.hlT = null; break;
    case "dd": st.dd = !st.dd; break;
    case "improve": st.modal = "improve"; st.improved = true; st.issue = null; st.hl = null; st.popKind = null; break;
    case "rebuild": alert("В макете: «Составить заново» спросит подтверждение и покажет итоги «было → стало»."); break;
    case "build": st.modal = "built"; break;
    case "mBuilt": st.modal = null; st.hasSchedule = true; st.scr = "grid"; break;
    case "undo": st.modal = null; st.improved = false; st.showChg = false; break;
    case "mGrid": st.modal = null; st.mode = "kon"; st.scr = "grid"; st.cls = "7-A"; st.par = "7"; st.showChg = true; st.by = false; break;
    case "mTransfer": st.modal = null; st.mode = "kon"; st.scr = "transfer"; break;
    case "showChg": st.showChg = !st.showChg; break;
    case "cls": st.cls = v; st.hl = null; st.popKind = null; break;
    case "nextPar": var ks = Object.keys(PAR), ni = (ks.indexOf(st.cls.split("-")[0]) + 1) % ks.length; st.cls = ks[ni]+"-"+PAR[ks[ni]][0]; st.hl = null; st.popKind = null; break;
    case "cell": st.hl = [+el.getAttribute("data-r"), +el.getAttribute("data-d")]; st.popKind = "lesson"; break;
    case "closePop": st.popKind = null; st.hl = null; break;
    case "backCheck": st.scr = "check"; st.issue = null; st.hl = null; st.popKind = null; st.by = false; st.hlT = null; st.hlS = null; break;
    case "selT": st.selTransfer = v; break;
    case "markDone": if(st.done[st.selTransfer]) delete st.done[st.selTransfer]; else st.done[st.selTransfer] = 1; break;
  }
  render();
});
render();
</script>
</body>
</html>
